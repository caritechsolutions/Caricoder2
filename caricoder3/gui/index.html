<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>caricoder3</title>
<style>
:root {
  --bg:#141a21; --rail:#0f1419; --panel:#1b232c; --panel2:#202a34; --line:#2b3741; --line2:#36434f;
  --fg:#e8edf2; --fg2:#aab6c2; --dim:#74828f;
  --air:#f0a53a;           /* on air: the amber lamp */
  --ok:#4cc38a; --bad:#ec5f4a; --warn:#e8c547; --acc:#5aa9ff;
  --r:8px;
}
* { box-sizing:border-box }
html,body { height:100% }
body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; display:flex; }
a { color:var(--acc); text-decoration:none } a:hover { text-decoration:underline }
code, .mono { font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace; font-size:12.5px }
button { font:inherit; color:var(--fg); background:var(--panel2); border:1px solid var(--line2); border-radius:var(--r); padding:7px 13px; cursor:pointer }
button:hover { border-color:#4a5a69 } button:disabled { opacity:.4; cursor:default }
button.primary { background:var(--acc); border-color:var(--acc); color:#06213f; font-weight:600 }
button.danger { color:#ffb3a6 } button.quiet { background:none; border-color:transparent; color:var(--fg2) } button.quiet:hover { color:var(--fg); border-color:var(--line2) }
input, select { font:inherit; color:var(--fg); background:#0f151b; border:1px solid var(--line2); border-radius:var(--r); padding:7px 9px; width:100%; min-width:0 }
input:focus, select:focus, button:focus-visible { outline:2px solid var(--acc); outline-offset:1px }
select { appearance:none; -webkit-appearance:none; background-image:linear-gradient(45deg,transparent 50%,var(--fg2) 50%),linear-gradient(135deg,var(--fg2) 50%,transparent 50%); background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%; background-size:5px 5px; background-repeat:no-repeat; padding-right:28px }
.lamp { display:inline-block; width:10px; height:10px; border-radius:50%; background:#3a4854; box-shadow:inset 0 0 0 1px rgba(0,0,0,.4); vertical-align:middle; flex:none }
.lamp.ok { background:var(--ok); box-shadow:0 0 0 3px rgba(76,195,138,.18), 0 0 10px rgba(76,195,138,.6) }
.lamp.warn { background:var(--warn); box-shadow:0 0 0 3px rgba(232,197,71,.18), 0 0 10px rgba(232,197,71,.6) }
.lamp.bad { background:var(--bad); box-shadow:0 0 8px rgba(236,95,74,.6) } .lamp.off { background:#3a4854 }

/* rail */
nav { width:270px; flex:none; background:var(--rail); border-right:1px solid var(--line); display:flex; flex-direction:column; height:100vh; position:sticky; top:0 }
nav .brand { padding:18px 18px 10px; font-weight:700; font-size:17px; letter-spacing:.2px } nav .brand small { display:block; font-weight:400; color:var(--dim); font-size:12px; margin-top:2px }
nav .list { flex:1; overflow:auto; padding:6px 10px }
nav .pages { display:flex; gap:4px; padding:4px 10px 8px } nav .pages a { flex:1; text-align:center; padding:7px 8px; border-radius:var(--r); color:var(--fg2); cursor:pointer; font-size:13px; border:1px solid transparent } nav .pages a:hover { background:var(--panel) } nav .pages a.on { background:var(--panel2); color:var(--fg); border-color:var(--line2) } nav .pages a span { color:var(--dim); margin-left:5px }
nav .filter { display:flex; gap:6px; padding:0 10px 6px } nav .filter input { flex:1; padding:6px 9px; font-size:13px } nav .filter select { flex:0 0 118px; padding:6px 8px; font-size:13px }
.back { color:var(--fg2); cursor:pointer; font-size:13px; margin-bottom:10px; display:inline-block } .back:hover { color:var(--fg) }
.stat { display:grid; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr)); gap:12px }
.stat .box { background:var(--panel2); border:1px solid var(--line); border-radius:var(--r); padding:12px 14px } .stat .box h4 { margin:0 0 6px; font-weight:500; color:var(--dim); font-size:12px } .stat .box .big { font-size:24px; font-weight:600 } .stat .box .sub { color:var(--dim); font-size:12px; margin-top:4px }
.bar { height:6px; background:var(--line); border-radius:3px; margin-top:8px; overflow:hidden } .bar i { display:block; height:100%; background:var(--acc) } .bar i.warn { background:var(--warn) } .bar i.bad { background:var(--bad) }
nav .ch { display:grid; grid-template-columns:14px 1fr auto; gap:10px; align-items:center; padding:9px 10px; border-radius:var(--r); cursor:pointer; color:var(--fg2) }
nav .ch:hover { background:var(--panel) } nav .ch.on { background:var(--panel2); color:var(--fg) }
nav .ch b { font-weight:600; display:block } nav .ch i { font-style:normal; font-size:12px; color:var(--dim); display:block }
nav .ch .rate { font-size:12px; color:var(--dim); text-align:right; white-space:nowrap }
nav .foot { padding:12px 14px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:8px } nav .foot .sys { color:var(--dim); font-size:12px }

/* main */
main { flex:1; min-width:0; padding:22px 28px 60px; max-width:1180px }
.head { display:flex; align-items:center; gap:14px; margin-bottom:18px; flex-wrap:wrap }
.head h1 { margin:0; font-size:22px; display:flex; align-items:center; gap:12px } .head .state { color:var(--fg2) } .head .sp { flex:1 }
.msg { padding:10px 14px; border-radius:var(--r); margin:0 0 14px } .msg.err { background:#3b211c; color:#ffd0c7 } .msg.ok { background:#1b3a2b; color:#c7f1d9 }

/* signal path */
.path { display:grid; grid-template-columns:1fr 24px 1fr 24px 1fr; align-items:stretch; gap:0; margin-bottom:22px }
.path .node { background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; min-height:110px }
.path .node h3 { margin:0 0 6px; font-size:12px; font-weight:600; color:var(--dim); text-transform:none }
.path .node .big { font-size:24px; font-weight:600; line-height:1.15 } .path .node .sub { color:var(--fg2); font-size:12.5px; margin-top:4px }
.path .arrow { display:flex; align-items:center; justify-content:center; color:var(--line2); font-size:20px }
.path .node.bad { border-color:var(--bad) } .path .node .flag { color:var(--warn) } .path .node .flag.bad { color:var(--bad) }

section.card { background:var(--panel); border:1px solid var(--line); border-radius:var(--r); margin-bottom:16px }
section.card > header { display:flex; align-items:center; gap:12px; padding:12px 16px; border-bottom:1px solid var(--line) }
section.card > header h2 { margin:0; font-size:15px } section.card > header .hint { color:var(--dim); font-size:12.5px } section.card > header .sp { flex:1 }
section.card > .body { padding:16px }
section.card.collapsed > .body { display:none } section.card > header .tog { cursor:pointer }

.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:12px 20px }
.kv b { display:block; font-weight:500; font-size:12px; color:var(--dim) } .kv span { font-size:15px }
.prog { border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-bottom:8px; cursor:pointer } .prog.on { border-color:var(--acc); background:var(--panel2, transparent) }
table { border-collapse:collapse; width:100% } th { text-align:left; font-weight:500; font-size:12px; color:var(--dim); padding:6px 10px; border-bottom:1px solid var(--line) }
td { padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:middle } tr:last-child td { border-bottom:none }

/* forms */
.f { display:grid; grid-template-columns:150px minmax(0,1fr); gap:12px 16px; align-items:center; max-width:860px }
.f label { color:var(--fg2) } .f .help { grid-column:2; color:var(--dim); font-size:12px; margin-top:-8px }
.f .row { display:flex; gap:8px; align-items:center } .f .row > * { flex:1 } .f .row .n { flex:0 0 90px } .f .row .x { flex:0 0 auto }
.rend { display:grid; grid-template-columns:1fr 1fr 1fr auto; gap:8px; align-items:center; margin-bottom:8px }
.rend .custom { display:flex; gap:6px; align-items:center } .rend .custom input { width:70px } .rend .custom span { color:var(--dim) }
.choice { display:inline-flex; border:1px solid var(--line2); border-radius:var(--r); overflow:hidden }
.choice button { border:none; border-radius:0; background:none; padding:7px 14px; color:var(--fg2) } .choice button.on { background:var(--panel2); color:var(--fg) }
.savebar { position:sticky; bottom:0; margin-top:14px; background:var(--panel2); border:1px solid var(--line2); border-radius:var(--r); padding:10px 14px; display:flex; gap:10px; align-items:center; box-shadow:0 -6px 20px rgba(0,0,0,.35) }
.savebar .sp { flex:1 } .savebar.hidden { display:none }
pre.log { margin:0; padding:12px 14px; background:#0d1216; border-radius:0 0 var(--r) var(--r); font:12px/1.55 ui-monospace,Menlo,Consolas,monospace; max-height:380px; overflow:auto; white-space:pre-wrap; color:var(--fg2) }
dialog { background:var(--panel); color:var(--fg); border:1px solid var(--line2); border-radius:12px; padding:22px; width:560px; max-width:95vw } dialog::backdrop { background:rgba(0,0,0,.6) }
dialog h3 { margin:0 0 14px; font-size:17px } dialog .actions { display:flex; justify-content:flex-end; gap:8px; margin-top:16px }
.urlprev { background:#0f151b; border:1px dashed var(--line2); border-radius:var(--r); padding:8px 10px; color:var(--fg2); word-break:break-all }
.empty { padding:40px 20px; text-align:center; color:var(--dim) }
.tag { display:inline-block; padding:1px 7px; border-radius:4px; background:var(--panel2); color:var(--fg2); font-size:12px }
.warn { color:var(--warn) } .bad { color:var(--bad) }
@media (max-width:900px) { body { flex-direction:column } nav { width:auto; height:auto; position:static; max-height:40vh } .path { grid-template-columns:1fr } .path .arrow { transform:rotate(90deg); height:20px } .f { grid-template-columns:1fr } .f .help { grid-column:1 } }
@media (prefers-reduced-motion:no-preference) { .lamp.running { animation:none } }
</style>
</head>
<body>
<nav>
  <div class="brand" onclick="goList()" style="cursor:pointer" title="All channels">caricoder3<small id="sysline">connecting…</small></div>
  <div class="pages"><a id="pg_list" onclick="goList()">Channels<span id="pg_count"></span></a><a id="pg_server" onclick="goServer()">Server</a></div>
  <div class="filter"><input id="f_q" placeholder="Filter by name" oninput="setFilter()"><select id="f_st" onchange="setFilter()"><option value="">All</option><option value="ok">Running fine</option><option value="warn">With trouble</option><option value="bad">Failed</option><option value="off">Stopped</option></select></div>
  <div class="list" id="rail"></div>
  <div class="foot"><button class="primary" onclick="newChannel()">New channel</button><div class="sys" id="sysright"></div></div>
</nav>
<main id="main"></main>
<dialog id="dlg"></dialog>

<script>
"use strict";
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtRate = b => !b ? "—" : b >= 1e6 ? (b/1e6).toFixed(2)+" Mb/s" : b >= 1e3 ? (b/1e3).toFixed(0)+" kb/s" : (b|0)+" b/s";
const fmtUp = s => { s = Math.floor(s||0); const d=Math.floor(s/86400), h=Math.floor(s%86400/3600), m=Math.floor(s%3600/60); return d ? `${d}d ${h}h` : h ? `${h}h ${m}m` : `${m}m ${s%60}s`; };
const sleep = ms => new Promise(r => setTimeout(r, ms));

const RES = [["", "Same as source"], ["1920x1080","1080p (1920 × 1080)"], ["1280x720","720p (1280 × 720)"], ["960x540","540p (960 × 540)"], ["854x480","480p (854 × 480)"], ["640x360","360p (640 × 360)"], ["426x240","240p (426 × 240)"], ["custom","Custom…"]];
const VBR = ["400k","600k","800k","1M","1.5M","2M","2.5M","3M","4M","5M","6M","8M","10M","12M"];
const ABR = ["64k","96k","128k","160k","192k","256k","320k","384k"];
const MUX = [["", "Variable (no padding)"], ["2M","2 Mb/s"],["3M","3 Mb/s"],["4M","4 Mb/s"],["5M","5 Mb/s"],["6M","6 Mb/s"],["8M","8 Mb/s"],["10M","10 Mb/s"],["12M","12 Mb/s"],["15M","15 Mb/s"],["20M","20 Mb/s"],["custom","Custom…"]];

let view = { name: null, page: "list" }, timer = null, sys = null, channels = [], dirty = false, logOpen = false;
let filt = { q: "", st: "" };
try { filt = Object.assign(filt, JSON.parse(localStorage.getItem("cc3filter") || "{}")); } catch(e) {}
function setFilter() { filt = { q: $("#f_q").value.trim().toLowerCase(), st: $("#f_st").value }; try { localStorage.setItem("cc3filter", JSON.stringify(filt)); } catch(e) {} renderRail(); if (!view.name && view.page === "list") renderOverview(); }
function visible(c) { return (!filt.q || c.name.toLowerCase().includes(filt.q)) && (!filt.st || health(c)[0] === filt.st); }
function leaveOk() { if (dirty && !confirm("Leave without saving the changes?")) return false; dirty = false; return true; }
function goList() { if (!leaveOk()) return; view = { name: null, page: "list" }; $("#main").dataset.chan = ""; refresh(); }
function goServer() { if (!leaveOk()) return; view = { name: null, page: "server" }; $("#main").dataset.chan = ""; refresh(); }
const prevCounters = {};   // per channel: the error counters at the last poll, to see what is still happening

/* The lamp: green = running and healthy, yellow = running with trouble
 * (no input, errors in the last few seconds, a transcoder failed, not
 * keeping up), red = failed to run, grey = stopped. Returns [class, why]. */
function health(c) {
  if (c._health) return c._health;        /* once per poll, so rail and page agree */
  return c._health = healthOf(c);
}
function healthOf(c) {
  if (c.state === "failed") return ["bad", c.why || "failed"];
  if (c.state !== "running") return ["off", c.state];
  const st = c.stats; if (!st) return ["warn", "starting"];
  const inp = st.input||{}, out = st.output||{}, clk = st.clock||{}, svc = st.service||{};
  const outs = (c.outputs && c.outputs.outputs) || [];
  const now = { cc: inp.cc_errors||0, ovf: inp.socket_overflow||0, drop: out.dropped_units||0, late: out.late_units||0, lost: (inp.link||{}).lost||0,
                send: outs.reduce((a,o)=>a+(o.errors||0)+(o.overruns||0),0), xdrop: (svc.streams||[]).reduce((a,s)=>a+(s.input_dropped||0),0) };
  const was = prevCounters[c.name] || now;
  prevCounters[c.name] = now;
  const why = [];
  if (inp.last_packet_age_ms > 2000 || (st.uptime_s > 10 && !inp.bitrate)) why.push("no input");
  if ((svc.streams||[]).some(s => s.failed)) why.push("a transcoder failed");
  if (st.uptime_s > 15 && !clk.locked) why.push("clock not locked");
  if (now.cc > was.cc) why.push("input errors");
  if (now.ovf > was.ovf) why.push("input overflow");
  if (now.lost > was.lost) why.push("packets lost on the link");
  if (now.drop > was.drop || now.xdrop > was.xdrop) why.push("dropping");
  if (now.late > was.late) why.push("running late");
  if (now.send > was.send) why.push("send errors");
  return why.length ? ["warn", why.join(", ")] : ["ok", "healthy"];
}

async function api(path, opts={}) {
  const r = await fetch(path, Object.assign({headers:{"Content-Type":"application/json"}}, opts));
  let j = null; try { j = await r.json(); } catch(e) {}
  if (!r.ok || (j && j.ok === false)) throw new Error((j && j.error) || (r.status + " " + r.statusText));
  return j;
}
function schedule(ms) { clearTimeout(timer); timer = setTimeout(refresh, ms); }
function showMsg(text, cls) { const m = $("#msg"); if (m) m.innerHTML = `<div class="msg ${cls}">${esc(text)}</div>`; }

/* ---------- data ---------- */
async function loadAll() {
  try { sys = await api("/api/system"); } catch(e) { sys = null; }
  $("#sysline").textContent = sys ? `${sys.version} on ${sys.host}` : "cannot reach the supervisor";
  $("#sysright").textContent = sys ? `${sys.running} of ${sys.channels} running · up ${fmtUp(sys.uptime)}` : "";
  try { channels = (await api("/api/channels")).channels; } catch(e) { channels = []; }
}
function renderRail() {
  $("#pg_list").classList.toggle("on", !view.name && view.page === "list"); $("#pg_server").classList.toggle("on", view.page === "server");
  $("#pg_count").textContent = channels.length ? channels.length : "";
  if ($("#f_q").value !== filt.q && document.activeElement !== $("#f_q")) $("#f_q").value = filt.q;
  if ($("#f_st").value !== filt.st) $("#f_st").value = filt.st;
  const shown = channels.filter(visible);
  $("#rail").innerHTML = shown.map(c => {
    const st = c.stats || {}, inp = st.input || {}, out = st.output || {};
    const [h, why] = health(c);
    return `<div class="ch ${view.name===c.name?"on":""}" onclick="openChannel('${esc(c.name)}')">
      <span class="lamp ${h}" title="${esc(why)}"></span>
      <div><b>${esc(c.name)}</b><i>${esc(c.state==="running" && h !== "ok" ? why : c.state)}${c.state==="running"?" · "+fmtUp(c.uptime):""}</i></div>
      <div class="rate">${c.state==="running" ? `${fmtRate(inp.bitrate)}<br>${fmtRate(out.bitrate)}` : ""}</div></div>`;
  }).join("") || `<div class="empty">${channels.length ? "No channel matches the filter." : "No channels yet."}</div>`;
}
function openChannel(name) { if (!leaveOk()) return; view = { name, page: "list" }; refresh(); }

/* ---------- overview (no channel chosen) ---------- */
function renderOverview() {
  const shown = channels.filter(visible);
  const rows = shown.map(c => { const st=c.stats||{}, inp=st.input||{}, out=st.output||{}, svc=st.service||{};
    const what = (svc.streams||[]).map(s => s.mode==="transcode" ? `${s.from||""} → ${s.codec||""}${s.size?" "+s.size:""}` : `${s.codec||""} copy`).join(", ");
    const outs = (c.outputs && c.outputs.outputs) || [];
    const [h, why] = health(c);
    return `<tr onclick="openChannel('${esc(c.name)}')" style="cursor:pointer"><td><span class="lamp ${h}"></span> ${esc(c.name)}</td><td>${esc(c.state)}${h==="warn"?` <span class="warn">${esc(why)}</span>`:c.why&&c.state!=="running"?` <span class="bad">${esc(c.why)}</span>`:""}</td><td class="mono">${esc((c.config||{}).input||"")}</td><td>${c.state==="running"?fmtRate(inp.bitrate):"—"}</td><td>${c.state==="running"?fmtRate(out.bitrate):"—"}</td><td style="color:var(--fg2)">${esc(what)}</td><td>${outs.map(o=>`<span class="tag">${esc(o.type)}</span>`).join(" ")}</td></tr>`; }).join("");
  const counts = { ok:0, warn:0, bad:0, off:0 }; channels.forEach(c => counts[health(c)[0]]++);
  $("#main").innerHTML = `<div class="head"><h1>Channels</h1><span class="state">${channels.length ? `${counts.ok} fine · ${counts.warn} with trouble · ${counts.bad} failed · ${counts.off} stopped${shown.length !== channels.length ? ` · showing ${shown.length} of ${channels.length}` : ""}` : ""}</span><div class="sp"></div></div>
    <section class="card"><table><thead><tr><th>Channel</th><th>State</th><th>Source</th><th>In</th><th>Out</th><th>Processing</th><th>Outputs</th></tr></thead>
    <tbody>${rows || `<tr><td colspan="7" class="empty">${channels.length ? "No channel matches the filter." : "No channels yet. \"New channel\" on the left makes one: give it a name and a source, and it is ready to be set up."}</td></tr>`}</tbody></table></section>`;
}

/* ---------- the server ---------- */
const fmtKB = kb => kb >= 1048576 ? (kb / 1048576).toFixed(1) + " GB" : Math.round(kb / 1024) + " MB";
const barCls = p => p >= 90 ? "bad" : p >= 75 ? "warn" : "";
function renderServer() {
  if (!sys) { $("#main").innerHTML = `<div class="head"><h1>Server</h1></div><div class="msg err">Cannot reach the supervisor.</div>`; return; }
  const st = sys.system || {}, cpu = st.cpu || {}, mem = st.memory || {};
  const memUsed = (mem.total_kb || 0) - (mem.available_kb || 0), memPct = mem.total_kb ? 100 * memUsed / mem.total_kb : 0;
  const swapUsed = (mem.swap_total_kb || 0) - (mem.swap_free_kb || 0);
  const gpus = st.gpus || [], ifs = st.interfaces || [];
  const running = channels.filter(c => c.state === "running");
  const inSum = running.reduce((a, c) => a + (((c.stats||{}).input||{}).bitrate || 0), 0), outSum = running.reduce((a, c) => a + (((c.stats||{}).output||{}).bitrate || 0), 0);
  $("#main").innerHTML = `<div class="head"><h1>Server</h1><span class="state">${esc(sys.host)} · caricoder3 ${esc(sys.version)} · up ${fmtUp(sys.uptime)}</span><div class="sp"></div></div>
    <section class="card"><header><h2>Load</h2><span class="hint">Sampled every 2 seconds</span></header><div class="body"><div class="stat">
      <div class="box"><h4>CPU</h4><div class="big">${(cpu.percent||0).toFixed(0)}%</div><div class="sub">${cpu.cores||"?"} cores · load ${(cpu.load1||0).toFixed(2)} / ${(cpu.load5||0).toFixed(2)} / ${(cpu.load15||0).toFixed(2)}</div><div class="bar"><i class="${barCls(cpu.percent||0)}" style="width:${Math.min(100, cpu.percent||0)}%"></i></div></div>
      <div class="box"><h4>Memory</h4><div class="big">${fmtKB(memUsed)}</div><div class="sub">of ${fmtKB(mem.total_kb||0)} used (${memPct.toFixed(0)}%)${mem.swap_total_kb ? ` · swap ${fmtKB(swapUsed)} of ${fmtKB(mem.swap_total_kb)}` : ""}</div><div class="bar"><i class="${barCls(memPct)}" style="width:${memPct.toFixed(0)}%"></i></div></div>
      <div class="box"><h4>Channels</h4><div class="big">${running.length} <span style="font-size:14px;font-weight:400;color:var(--dim)">of ${channels.length} running</span></div><div class="sub">${fmtRate(inSum)} in · ${fmtRate(outSum)} out</div></div>
      ${gpus.map(g => `<div class="box"><h4>GPU ${g.index} · ${esc(g.name)}</h4><div class="big">${g.util >= 0 ? g.util + "%" : "—"}</div><div class="sub">encoder ${g.encoder >= 0 ? g.encoder + "%" : "—"} · decoder ${g.decoder >= 0 ? g.decoder + "%" : "—"}${g.mem_total > 0 ? ` · memory ${g.mem_used} of ${g.mem_total} MB` : ""}${g.temp >= 0 ? ` · ${g.temp} °C` : ""}${g.power >= 0 ? ` · ${g.power} W` : ""}</div><div class="bar"><i class="${barCls(Math.max(g.util||0, g.encoder||0, g.decoder||0))}" style="width:${Math.max(0, g.util||0)}%"></i></div></div>`).join("")}

      </tbody></table></section>
    <section class="card"><header><h2>This build</h2><span class="hint">Codecs and transports compiled in</span></header><div class="body"><pre class="log" style="border-radius:var(--r);max-height:none">${esc(sys.backends || "")}</pre></div></section>`;
}

/* ---------- a channel ---------- */
let current = null;   // the channel object as last fetched
async function renderChan(name) {
  let data; try { data = await api("/api/channels/" + encodeURIComponent(name)); } catch(e) { $("#main").innerHTML = `<div class="msg err">${esc(e.message)}</div>`; view = {name:null, page:"list"}; return; }
  const c = current = data.channel, running = c.state === "running";
  const inRail = channels.find(x => x.name === c.name);
  if (inRail && inRail._health) c._health = inRail._health;
  const formHtml = $("#settings") ? null : settingsHtml();   // keep the form while editing
  if (!$("#main .head") || $("#main").dataset.chan !== name) {
    $("#main").dataset.chan = name;
    $("#main").innerHTML = `
      <a class="back" onclick="goList()">‹ All channels</a>
      <div class="head"><h1><span class="lamp" id="hlamp"></span>${esc(c.name)}</h1><span class="state" id="hstate"></span><div class="sp"></div>
        <span id="hbtns"></span></div>
      <div id="msg"></div>
      <div class="path" id="path"></div>
      <section class="card" id="outputs"></section>
      <section class="card" id="settingscard"><header><h2>Settings</h2><span class="hint">A running channel restarts when settings are saved.</span></header><div class="body" id="settings">${settingsHtml()}</div></section>
      <section class="card ${logOpen?"":"collapsed"}" id="logcard"><header><h2>Log</h2><span class="hint">The last lines this channel wrote</span><div class="sp"></div><button class="quiet tog" onclick="logOpen=!logOpen;this.closest('section').classList.toggle('collapsed')">${logOpen?"Hide":"Show"}</button></header><div class="body" style="padding:0"><pre class="log" id="log"></pre></div></section>
      <div class="savebar hidden" id="savebar"><span>Settings changed</span><div class="sp"></div><button class="quiet" onclick="fillForm(current.config||{});setDirty(false)">Discard</button><button class="primary" onclick="saveChannel()">Save changes</button></div>`;
    fillForm(c.config || {});
  }
  const [h, why] = health(c);
  $("#hlamp").className = "lamp " + h;
  $("#hstate").innerHTML = `${esc(c.state)}${running ? " · up " + fmtUp(c.uptime) : c.why ? ` · <span class="bad">${esc(c.why)}</span>` : ""}${running && h === "warn" ? ` · <span class="warn">${esc(why)}</span>` : ""}${c.restarts ? ` · ${c.restarts} restart${c.restarts>1?"s":""}` : ""}`;
  $("#hbtns").innerHTML = `<button onclick="act('start')" ${running?"disabled":""}>Start</button> <button onclick="act('stop')" ${!running?"disabled":""}>Stop</button> <button onclick="act('restart')">Restart</button> <button class="danger quiet" onclick="delChannel()">Delete</button>`;
  $("#path").innerHTML = pathHtml(c);
  $("#outputs").innerHTML = outputsHtml(c);
  $("#log").textContent = (c.log||[]).join("\n") || "(nothing yet)";
  renderRail();
}

function pathHtml(c) {
  const st = c.stats; if (!st) return `<div class="node"><h3>Source</h3><div class="sub">${esc((c.config||{}).input||"")}</div></div><div class="arrow">›</div><div class="node"><h3>Processing</h3><div class="sub">Not running</div></div><div class="arrow">›</div><div class="node"><h3>Outputs</h3><div class="sub">${((c.saved_outputs||{}).outputs||[]).length} saved</div></div>`;
  const inp = st.input||{}, out = st.output||{}, clk = st.clock||{}, svc = st.service||{};
  const inBad = inp.last_packet_age_ms > 2000 || inp.bitrate === 0;
  const xs = (svc.streams||[]).filter(s => s.mode === "transcode");
  const proc = !(svc.streams||[]).length ? `<span style="color:var(--dim)">Waiting for the source</span>` : xs.length ? xs.map(s => `${s.from||""} → ${s.codec||""}${s.size?" "+s.size:""}${s.encoder?` <span style="color:var(--dim)">on ${s.encoder}</span>`:""}`).join("<br>") : "Copied as is";
  const slack = xs.length ? Math.min(...xs.map(s => s.slack_min_ms ?? 1e9)) : null;
  const outs = (c.outputs && c.outputs.outputs) || [];
  const oerr = outs.reduce((a,o)=>a+(o.errors||0)+(o.overruns||0),0);
  return `
    <div class="node ${inBad?"bad":""}"><h3>Source</h3><div class="big">${fmtRate(inp.bitrate)}</div>
      <div class="sub">${esc(inp.url||"")}</div>
      ${inp.link ? `<div class="sub">${inp.link.transport.toUpperCase()} ${inp.link.connected ? esc(inp.link.state) : `<span class="flag ${st.uptime_s > 10 ? "bad" : ""}">${esc(inp.link.state)}</span>`}${inp.link.connected && inp.link.rtt_ms ? ` · RTT ${inp.link.rtt_ms.toFixed(1)} ms` : ""}${inp.link.recovered ? ` · ${inp.link.recovered} recovered` : ""}${inp.link.lost ? ` · <span class="flag">${inp.link.lost} lost</span>` : ""}${inp.link.reconnects ? ` · ${inp.link.reconnects} reconnects` : ""}</div>` : ""}
      <div class="sub">${inBad ? `<span class="flag bad">no input for ${inp.last_packet_age_ms>=0?(inp.last_packet_age_ms/1000).toFixed(0)+" s":"a while"}</span>` : `clock ${clk.locked?"locked":"<span class='flag'>not locked</span>"} · ${(clk.drift_ppm||0).toFixed(1)} ppm`}${inp.cc_errors?` · <span class="flag">${inp.cc_errors} CC errors</span>`:""}${inp.socket_overflow?` · <span class="flag bad">${inp.socket_overflow} socket overflows</span>`:""}</div></div>
    <div class="arrow">›</div>
    <div class="node"><h3>Processing</h3><div class="sub" style="font-size:14px;color:var(--fg)">${proc}</div>
      <div class="sub">${xs.length ? `${xs.reduce((a,s)=>a+(s.frames_out||0),0)} frames out · ${slack!=null&&slack<1e9?`${(slack/1000).toFixed(1)} s to spare`:""}${xs.some(s=>s.failed)?` · <span class="flag bad">a transcoder failed</span>`:""}${xs.reduce((a,s)=>a+(s.input_dropped||0),0)?` · <span class="flag">${xs.reduce((a,s)=>a+(s.input_dropped||0),0)} frames dropped</span>`:""}` : (svc.streams||[]).length ? `${(svc.streams||[]).length} streams, program ${svc.number??""}` : ""}</div></div>
    <div class="arrow">›</div>
    <div class="node"><h3>Outputs</h3><div class="big">${fmtRate(out.bitrate)}</div>
      <div class="sub">${esc(out.mode==="cbr"?`constant ${fmtRate(out.muxrate)}, ${(out.null_percent||0).toFixed(0)}% padding`:"variable rate")}</div>
      <div class="sub">${outs.length} output${outs.length===1?"":"s"}${oerr?` · <span class="flag">${oerr} send errors</span>`:""}${out.late_units?` · <span class="flag">${out.late_units} late</span>`:""}${out.dropped_units?` · <span class="flag bad">${out.dropped_units} dropped</span>`:""}</div></div>`;
}

};
const enc = s => encodeURIComponent(s);
function outputsHtml(c) {
  const running = c.state === "running";

  const rows = outs.map(o => `<tr><td><span class="tag">${esc(o.type||o.url.split(":")[0])}</span></td><td class="mono">${esc(o.url)}</td><td>${esc(o.state||"")}</td>
      <td style="color:var(--fg2)">${o.packets!=null ? `${o.packets.toLocaleString()} pkts${o.errors?` · <span class="warn">${o.errors} errors</span>`:""}${o.overruns?` · <span class="bad">${o.overruns} overruns</span>`:""}${o.rtt_ms!=null?` · rtt ${o.rtt_ms} ms`:""}${o.retransmitted?` · ${o.retransmitted} resent`:""}${o.reconnects?` · ${o.reconnects} reconnects`:""}` : ""}</td>

      <button class="primary" onclick="addOutput()" ${running?"":"disabled title='Start the channel first'"}>Add output</button></header>
    <div class="body" style="padding:0 0 4px">${rows ? `<table><thead><tr><th>Type</th><th>Where</th><th>State</th><th>Counters</th><th>Id</th><th></th></tr></thead><tbody>${rows}</tbody></table>` : `<div class="empty">No outputs yet. ${running?"Add one above.":"Start the channel, then add outputs."}</div>`}
    ${hls ? `<div style="padding:10px 16px;color:var(--fg2)">Players open <a href="/hls/${esc(c.name)}/index.m3u8" target="_blank">http://${location.host}/hls/${esc(c.name)}/index.m3u8</a></div>` : ""}</div>`;
}
function addOutput() {
  const d = $("#dlg");
  const sel = Object.entries(TYPES).map(([k,t]) => `<option value="${k}">${t.label}</option>`).join("");
  d.innerHTML = `<h3>Add an output</h3><div class="f"><label>Type</label><select id="o_type">${sel}</select><div id="o_fields" style="display:contents"></div>
    <label>Will be</label><div class="urlprev" id="o_prev"></div></div><div id="o_msg" style="margin-top:10px"></div>
    <div class="actions"><button onclick="document.getElementById('dlg').close()">Cancel</button><button class="primary" id="o_go">Add output</button></div>`;
  const fields = () => { const t = TYPES[$("#o_type").value]; $("#o_fields").innerHTML = t.fields.map(([k,l,ph]) => `<label>${l}</label><input data-k="${k}" value="${esc(ph)}" placeholder="${esc(ph)}">`).join(""); d.querySelectorAll("input").forEach(i => i.oninput = prev); prev(); };
  const vals = () => { const f = {}; d.querySelectorAll("input[data-k]").forEach(i => f[i.dataset.k] = i.value.trim()); return f; };
  const prev = () => { $("#o_prev").textContent = TYPES[$("#o_type").value].make(vals()); };
  $("#o_type").onchange = fields; fields();
  $("#o_go").onclick = async () => {
    try { await api(`/api/channels/${encodeURIComponent(view.name)}/outputs`, {method:"POST", body: JSON.stringify({url: TYPES[$("#o_type").value].make(vals())})}); d.close(); schedule(200); }
    catch(e) { $("#o_msg").innerHTML = `<div class="msg err">${esc(e.message)}</div>`; }
  };
  d.showModal();
}
async function delOutput(id) {
  if (!confirm(`Remove output ${id}? Receivers of it lose the stream.`)) return;
  try { await api(`/api/channels/${encodeURIComponent(view.name)}/outputs/${encodeURIComponent(id)}`, {method:"DELETE"}); } catch(e) { showMsg(e.message, "err"); return; }
  schedule(200);
}

const IN_KINDS = [["udp","UDP multicast / unicast"],["rtp","RTP"],["srtl","SRT — a sender calls us"],["srtc","SRT — we call the sender"],["ristl","RIST — a sender calls us"],["ristc","RIST — we call the sender"],["file","File (test)"]];
const OWN_PARAMS = { udp: ["iface"], rtp: ["iface"], srtl: ["latency","passphrase","mode"], srtc: ["latency","passphrase","mode"], ristl: ["secret","aes-type","buffer"], ristc: ["secret","aes-type","buffer"] };
function inputUrl(v) {
  const q = [];
  const rest = () => { const r = v.extra ? v.extra.split("&").filter(Boolean) : []; return q.concat(r); };   // parameters the form does not own are kept
  switch (v.kind) {
  case "file": return v.host;
  case "udp": case "rtp":
    if (v.iface) q.push("iface=" + v.iface);
    return `${v.kind}://${v.src?v.src+"@":""}${v.host}${v.port?":"+v.port:""}${rest().length?"?"+rest().join("&"):""}`;
  case "srtl": case "srtc":
    if (v.latency) q.push("latency=" + v.latency);
    if (v.pass) q.push("passphrase=" + v.pass);
    if (v.kind === "srtl" && v.host) q.push("mode=listener");
    return `srt://${v.host}:${v.port}${rest().length?"?"+rest().join("&"):""}`;
  case "ristl": case "ristc":
    if (v.secret) { q.push("secret=" + v.secret); q.push("aes-type=" + (v.aes || "128")); }
    if (v.buffer) q.push("buffer=" + v.buffer);
    return `rist://${v.kind==="ristl"?"@":""}${v.host}:${v.port}${rest().length?"?"+rest().join("&"):""}`;
  }
  return "";
}
function inputForm() {
  return { kind: $("#in_kind").value, host: $("#in_host").value.trim(), port: $("#in_port").value.trim(),
           iface: $("#in_iface").value.trim(), src: $("#in_src").value.trim(),
           latency: $("#in_latency").value.trim(), pass: $("#in_pass").value.trim(),
           secret: $("#in_secret").value.trim(), buffer: $("#in_buffer").value.trim(), extra: $("#in_extra").value, aes: $("#in_aes").value };
}
function syncInput() {
  const v = inputForm(), k = v.kind;
  $("#in_udp").style.display = (k === "udp" || k === "rtp") ? "" : "none";
  $("#in_srt").style.display = (k === "srtl" || k === "srtc") ? "" : "none";
  $("#in_rist").style.display = (k === "ristl" || k === "ristc") ? "" : "none";
  $("#in_host").placeholder = k === "file" ? "/path/to/file.ts" : (k === "srtc" || k === "ristc") ? "sender's address" : (k === "ristl" || k === "srtl") ? "address to listen on, or blank for all" : "239.5.5.5 (address)";
  $("#in_url").textContent = inputUrl(v);
}
function parseInput(url) {
  const r = { kind: "file", host: url || "", port: "", iface: "", src: "", latency: "", pass: "", secret: "", buffer: "", extra: "" };
  const m = /^(udp|rtp|srt|rist):\/\/(@?)(?:([^@\/?:]+)@)?([^:?]*)(?::(\d+))?(?:\?(.*))?$/.exec(url || "");
  if (!m) return r;
  const parts = (m[6]||"").split("&").filter(Boolean);
  const q = Object.fromEntries(parts.map(x => [x.split("=")[0], x.slice(x.indexOf("=") + 1)]));
  r.host = m[4]; r.port = m[5] || "";
  if (m[1] === "udp" || m[1] === "rtp") { r.kind = m[1]; r.iface = q.iface || ""; r.src = m[3] || ""; }
  else if (m[1] === "srt") { r.kind = (!m[4] || q.mode === "listener") && q.mode !== "caller" ? "srtl" : "srtc"; r.latency = q.latency || ""; r.pass = q.passphrase || ""; }
  else { r.kind = m[2] ? "ristl" : "ristc"; r.secret = q.secret || ""; r.buffer = q.buffer || ""; r.aes = q["aes-type"] || ""; }
  r.extra = parts.filter(x => !OWN_PARAMS[r.kind].includes(x.split("=")[0])).join("&");
  return r;
}
function rendRow(spec) {
  // spec: "WxH:codec:rate" | "codec:rate" | "codec"
  let size = "", codec = "h264", rate = "";
  const parts = (spec||"").split(":");
  if (/^\d+x\d+$/.test(parts[0])) { size = parts.shift(); }
  if (parts[0]) codec = parts[0];
  rate = parts[1] || "";
  const resKnown = RES.some(r => r[0] === size);
  const rateKnown = !rate || VBR.includes(rate);
  return `<div class="rend">
    <div><select class="r_res" onchange="this.parentNode.querySelector('.custom').style.display=this.value==='custom'?'':'none'">${RES.map(r=>`<option value="${r[0]}" ${(resKnown?size:"custom")===r[0]?"selected":""}>${r[1]}</option>`).join("")}</select>
      <div class="custom" style="margin-top:6px;${resKnown?"display:none":""}"><input class="r_w" placeholder="width" value="${size.split("x")[0]||""}"><span>×</span><input class="r_h" placeholder="height" value="${size.split("x")[1]||""}"></div></div>
    <select class="r_codec"><option value="h264" ${codec==="h264"?"selected":""}>H.264</option><option value="hevc" ${codec==="hevc"?"selected":""}>HEVC / H.265</option></select>
    <div><select class="r_rate" onchange="this.parentNode.querySelector('.r_rc').style.display=this.value==='custom'?'':'none'">${VBR.map(r=>`<option ${rate===r?"selected":""}>${r}</option>`).join("")}<option value="custom" ${rateKnown?"":"selected"}>Custom…</option></select><input class="r_rc" placeholder="e.g. 2500k" value="${rateKnown?"":esc(rate)}" style="margin-top:6px;${rateKnown?"display:none":""}"></div>
    <button type="button" class="quiet" title="Remove this rendition" onclick="this.parentNode.remove();setDirty(true)">✕</button></div>`;
}
function setVideo(xc) {
  $("#v_copy").classList.toggle("on", !xc); $("#v_xc").classList.toggle("on", xc);
  const r = $("#v_rows");
  if (!xc) { r.innerHTML = `<div style="color:var(--dim)">The video stream passes through untouched.</div>`; }
  else if (!r.querySelector(".rend")) { r.innerHTML = rendHeader() + rendRow("h264:3M") + rendAdd(); }
  setDirty(true);
}
const rendHeader = () => `<div class="rend" style="margin-bottom:4px;color:var(--dim);font-size:12px"><div>Resolution</div><div>Codec</div><div>Bit rate</div><div></div></div>`;
const rendAdd = () => `<div><button type="button" class="quiet" onclick="this.parentNode.insertAdjacentHTML('beforebegin', rendRow('640x360:h264:1M'));setDirty(true)">+ Add a rendition</button> <span style="color:var(--dim);font-size:12px">Each rendition is a program of the output and a variant in HLS; key frames stay aligned.</span></div>`;
function fillForm(cfg) {
  const i = parseInput(cfg.input); $("#in_kind").value = i.kind; $("#in_host").value = i.host; $("#in_port").value = i.port; $("#in_iface").value = i.iface; $("#in_src").value = i.src;
  $("#in_latency").value = i.latency; $("#in_pass").value = i.pass; $("#in_secret").value = i.secret; $("#in_buffer").value = i.buffer; $("#in_extra").value = i.extra; $("#in_aes").value = i.aes || ""; syncInput();
  $("#program").value = cfg.program || "";
  $("#drop").value = (cfg.drop || []).join(","); showDrop();
  const mux = cfg.muxrate ? String(cfg.muxrate) : "";
  if (MUX.some(m => m[0] === mux)) { $("#muxsel").value = mux; $("#muxcustom").style.display = "none"; } else { $("#muxsel").value = "custom"; $("#muxcustom").value = mux; $("#muxcustom").style.display = ""; }
  $("#vbr").checked = !!cfg.vbr;
  const vids = cfg.video || [];
  $("#v_copy").classList.toggle("on", !vids.length); $("#v_xc").classList.toggle("on", !!vids.length);
  $("#v_rows").innerHTML = vids.length ? rendHeader() + vids.map(rendRow).join("") + rendAdd() : `<div style="color:var(--dim)">The video stream passes through untouched.</div>`;
  const a = (cfg.audio || [])[0] || ""; const ap = a.split("=").pop().split(":");
  $("#a_codec").value = ap[0] && ["aac","mp2","mp3"].includes(ap[0]) ? ap[0] : ""; $("#a_rate").value = ap[1] && ABR.includes(ap[1]) ? ap[1] : "128k"; $("#a_rate").disabled = !$("#a_codec").value;
  $("#decoder").value = cfg.decoder || ""; $("#encoder").value = cfg.encoder || ""; $("#gpu").value = cfg.gpu ? String(cfg.gpu) : ""; $("#preset").value = cfg.preset || "";
  for (const k of ["delay","gop","vbv","service_name","service_provider"]) $("#"+k).value = cfg[k] ?? "";
  $("#enabled").value = String(cfg.enabled !== false);
  setDirty(false);
}
const dropNames = {};   // pid -> "audio spa AC-3", from the last scan, for the Streams line
function showDrop() {
  const d = $("#drop").value.split(",").filter(Boolean);
  $("#drop_text").innerHTML = d.length ? `Left out: ${d.map(p => `<span class="mono">${esc(p)}</span>${dropNames[p] ? " (" + esc(dropNames[p]) + ")" : ""}`).join(", ")}. The rest pass.` : "All streams of the program.";
  $("#drop_clear").style.display = d.length ? "" : "none";
}
const fmtK = b => b >= 1e6 ? (b / 1e6).toFixed(2) + " Mb/s" : Math.round(b / 1000) + " kb/s";
function streamLine(x) {
  const bits = [];
  if (x.kind === "video") bits.push((x.codec || x.type_name).toUpperCase().replace("MPEG2", "MPEG-2"), x.width ? `${x.width}x${x.height}${x.interlaced ? "i" : x.interlaced === false ? "p" : ""}` : "", x.fps ? `${x.fps.toFixed(x.fps % 1 ? 2 : 0)} fps` : "", x.profile || "");
  else if (x.kind === "audio") bits.push((x.codec || x.type_name).toUpperCase().replace("MPA", "MPEG audio"), x.language || "", x.sample_rate ? `${x.sample_rate / 1000} kHz` : "", x.channels ? (x.channels === 1 ? "mono" : x.channels === 2 ? "stereo" : x.channels + " ch") : "");
  else bits.push(x.type_name, x.language || "");
  bits.push(fmtK(x.bitrate));
  if (x.scrambled) bits.push("scrambled");
  if (x.cc_errors) bits.push(`${x.cc_errors} CC errors`);
  return bits.filter(Boolean).join(" · ");
}
async function scanSource() {
  const shown = $("#in_url").textContent, d = $("#dlg");
  if (!shown || shown.endsWith("://")) { showMsg("A source address is needed before scanning.", "err"); return; }
  const url = shown.includes("://") ? shown : "file:" + shown;
  const run = (d._scan = (d._scan || 0) + 1);
  d.innerHTML = `<h3>Scanning the source</h3><div style="color:var(--dim)">Listening to <span class="mono">${esc(shown)}</span> for 3 seconds…${/^(srt:\/\/[^?]*:\d*(\?.*mode=listener.*)?$|rist:\/\/@)/.test(url) && current && current.state === "running" ? "<br>A listening source can only be scanned while the channel is stopped: the running channel holds the port." : ""}</div>
    <div class="actions"><button onclick="document.getElementById('dlg')._scan++;document.getElementById('dlg').close()">Cancel</button></div>`;
  d.showModal();
  let rep;
  try { rep = await api("/api/probe", {method:"POST", body: JSON.stringify({url, seconds: 3})}); if (d._scan !== run) return; }
  catch(e) { if (d._scan !== run) return; d.innerHTML = `<h3>Scan failed</h3><div class="msg err">${esc(e.message)}</div><div class="actions"><button onclick="document.getElementById('dlg').close()">Close</button></div>`; return; }
  const cur = Number($("#program").value) || 0;
  const dropped = new Set($("#drop").value.split(",").filter(Boolean).map(Number));
  const progs = rep.programs || [];
  if (!progs.length) { d.innerHTML = `<h3>Nothing found</h3><div class="msg err">${esc(rep.bitrate ? "Packets arrive (" + fmtK(rep.bitrate) + ") but no program table was seen." : "Nothing arrived from the source.")}</div><div class="actions"><button onclick="document.getElementById('dlg').close()">Close</button></div>`; return; }
  const pick = progs.some(p => p.number === cur) ? cur : progs[0].number;
  d.innerHTML = `<h3>What the source carries</h3><div style="color:var(--dim);margin-bottom:10px">${fmtK(rep.bitrate)} in all, ${progs.length} program${progs.length === 1 ? "" : "s"}${rep.sync_errors ? `, <span class="flag bad">${rep.sync_errors} sync errors</span>` : ""}. Pick the program, then untick any stream to leave out.</div>
    <div id="p_list" style="max-height:60vh;overflow:auto"></div><div class="actions"><button onclick="document.getElementById('dlg').close()">Cancel</button><button class="primary" id="p_go">Use this program</button></div>`;
  const render = () => {
    const sel = Number(d.dataset.sel);
    $("#p_list").innerHTML = progs.map(p => `<div class="prog ${p.number === sel ? "on" : ""}" onclick="document.getElementById('dlg').dataset.sel='${p.number}';document.getElementById('dlg')._render()">
      <div style="display:flex;gap:10px;align-items:baseline"><input type="radio" name="prog" ${p.number === sel ? "checked" : ""} style="width:auto"><b>${esc(p.name || "(no name)")}</b><span class="mono" style="color:var(--dim)">program ${p.number}</span><span style="color:var(--dim)">${fmtK(p.bitrate)}${p.scrambled ? " · scrambled" : ""}${p.pmt_seen ? "" : " · no PMT seen"}</span></div>
      ${p.number === sel ? `<div style="margin:8px 0 0 26px">${p.streams.map(x => `<label style="display:flex;gap:8px;align-items:center;padding:3px 0;cursor:pointer"><input type="checkbox" data-pid="${x.pid}" ${dropped.has(x.pid) ? "" : "checked"} style="width:auto" onclick="event.stopPropagation()"><span class="mono" style="color:var(--dim);width:52px">${x.pid}</span><span style="width:70px;color:var(--dim)">${esc(x.kind)}</span><span>${esc(streamLine(x))}</span></label>`).join("")}</div>` : ""}</div>`).join("");
  };
  d.dataset.sel = String(pick); d._render = render; render();
  $("#p_go").onclick = () => {
    const sel = Number(d.dataset.sel), prog = progs.find(p => p.number === sel);
    const off = [...d.querySelectorAll("input[type=checkbox][data-pid]")].filter(c => !c.checked).map(c => Number(c.dataset.pid));
    if (off.length === prog.streams.length) { showMsg("At least one stream has to stay.", "err"); return; }
    $("#program").value = sel;
    for (const x of prog.streams) dropNames[x.pid] = `${x.kind}${x.language ? " " + x.language : ""} ${(x.codec || x.type_name).toUpperCase()}`;
    $("#drop").value = off.join(","); showDrop(); setDirty(true); d.close();
  };
}
function readForm() {
  const v = id => $("#"+id).value.trim(), num = id => v(id) === "" ? undefined : Number(v(id));
  const cfg = {};
  cfg.input = $("#in_url").textContent;
  if (num("program")) cfg.program = num("program");
  if (v("drop")) cfg.drop = v("drop").split(",").map(Number).filter(x => x > 0);
  const mux = $("#muxsel").value === "custom" ? v("muxcustom") : $("#muxsel").value; if (mux) cfg.muxrate = mux;
  if ($("#vbr").checked && mux) cfg.vbr = true;
  if ($("#v_xc").classList.contains("on")) {
    cfg.video = [...$("#v_rows").querySelectorAll(".rend")].filter(r => r.querySelector(".r_res")).map(r => {
      let size = r.querySelector(".r_res").value; if (size === "custom") size = `${r.querySelector(".r_w").value.trim()}x${r.querySelector(".r_h").value.trim()}`;
      let rate = r.querySelector(".r_rate").value; if (rate === "custom") rate = r.querySelector(".r_rc").value.trim();
      return `${size?size+":":""}${r.querySelector(".r_codec").value}${rate?":"+rate:""}`; });
    if (!cfg.video.length) delete cfg.video;
  }
  if (v("a_codec")) cfg.audio = [`${v("a_codec")}:${$("#a_rate").value}`];
  for (const k of ["decoder","encoder","preset","service_name","service_provider"]) if (v(k)) cfg[k] = v(k);
  if (v("gpu")) cfg.gpu = Number(v("gpu"));
  for (const k of ["delay","gop","vbv"]) if (num(k)) cfg[k] = num(k);
  cfg.enabled = v("enabled") === "true";
  return cfg;
}
function setDirty(d) { dirty = d; $("#savebar").classList.toggle("hidden", !d); }
async function saveChannel() {
  const cfg = readForm();
  if (!cfg.input || cfg.input.endsWith("://")) { showMsg("A source address is needed.", "err"); return; }
  if (/^(srt|rist):\/\/[^?]*:(\?|$)/.test(cfg.input)) { showMsg("The SRT or RIST port is needed.", "err"); return; }
  if (/passphrase=[^&]{1,9}(&|$)/.test(cfg.input)) { showMsg("An SRT passphrase is 10 characters or more.", "err"); return; }
  for (const r of cfg.video || []) if (!/^(\d+x\d+:)?(h264|hevc)(:\S+)?$/.test(r)) { showMsg("A custom resolution needs both width and height, and a bit rate like 2500k.", "err"); return; }
  try { await api(`/api/channels/${encodeURIComponent(view.name)}`, {method:"PUT", body: JSON.stringify(cfg, null, 2) + "\n"}); setDirty(false); showMsg("Saved." + (current && current.state === "running" ? " The channel is restarting with the new settings." : ""), "ok"); schedule(800); }
  catch(e) { showMsg(e.message, "err"); }
}
async function act(what) {
  try { await api(`/api/channels/${encodeURIComponent(view.name)}/${what}`, {method:"POST"}); } catch(e) { showMsg(e.message, "err"); return; }
  schedule(500);
}
async function delChannel() {
  if (!confirm(`Delete channel ${view.name}? It is stopped and its settings removed.`)) return;
  try { await api(`/api/channels/${encodeURIComponent(view.name)}`, {method:"DELETE"}); dirty = false; view = {name:null, page:"list"}; $("#main").dataset.chan = ""; refresh(); } catch(e) { showMsg(e.message, "err"); }
}
function newChannel() {
  const d = $("#dlg");
  d.innerHTML = `<h3>New channel</h3><div class="f"><label>Name</label><input id="n_name" placeholder="e.g. bet, cnn-hd (letters, digits, - and _)">
    <label>Source</label><div class="row"><input id="n_host" placeholder="239.5.5.5"><input id="n_port" class="n" placeholder="port"></div>
    <div class="help">A UDP multicast group and port. Everything else is set on the channel's page afterwards.</div></div>
    <div id="n_msg" style="margin-top:10px"></div><div class="actions"><button onclick="document.getElementById('dlg').close()">Cancel</button><button class="primary" id="n_go">Create channel</button></div>`;
  $("#n_go").onclick = async () => {
    const name = $("#n_name").value.trim(), host = $("#n_host").value.trim(), port = $("#n_port").value.trim();
    try { await api(`/api/channels/${encodeURIComponent(name)}`, {method:"PUT", body: JSON.stringify({input: `udp://${host}${port?":"+port:""}`, enabled: false}, null, 2)}); d.close(); dirty = false; view = {name, page:"list"}; $("#main").dataset.chan = ""; refresh(); }
    catch(e) { $("#n_msg").innerHTML = `<div class="msg err">${esc(e.message)}</div>`; }
  };
  d.showModal(); $("#n_name").focus();
}

/* ---------- loop ---------- */
async function refresh() {
  clearTimeout(timer);
  await loadAll();
  renderRail();
  if (view.name) await renderChan(view.name); else { $("#main").dataset.chan = ""; if (view.page === "server") renderServer(); else renderOverview(); }
  schedule(2000);
}
refresh();
</script>
