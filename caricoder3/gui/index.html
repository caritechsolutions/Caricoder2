    const off = [...d.querySelectorAll("input[type=checkbox][data-pid]")].filter(c => !c.checked).map(c => Number(c.dataset.pid));
    if (off.length === prog.streams.length) { showMsg("At least one stream has to stay.", "err"); return; }
    $("#program").value = sel;
    for (const x of prog.streams) dropNames[x.pid] = `${x.kind}${x.language ? " " + x.language : ""} ${(x.codec || x.type_name).toUpperCase()}`;
    $("#drop").value = off.join(","); showDrop();
    lastScanStreams = prog.streams; if (!((((current || {}).stats || {}).service || {}).streams || []).length) pidRowsBuild(readForm());
    setDirty(true); d.close();
  };
}
function readForm() {
  const v = id => $("#"+id).value.trim(), num = id => v(id) === "" ? undefined : Number(v(id));
  const cfg = {};
  cfg.input = $("#in_url").textContent;
  if (num("program")) cfg.program = num("program");
  if (v("drop")) cfg.drop = v("drop").split(",").map(Number).filter(x => x > 0);
  if (backups.length) cfg.backup_inputs = backups.slice();
  if (num("switch_after")) cfg.switch_after = num("switch_after");
  if (num("retry_primary")) cfg.retry_primary = num("retry_primary");
  const mux = $("#muxsel").value === "custom" ? v("muxcustom") : $("#muxsel").value; if (mux) cfg.muxrate = mux;
  if ($("#vbr").checked && mux) cfg.vbr = true;
  if ($("#v_xc").classList.contains("on")) {
    cfg.video = [...$("#v_rows").querySelectorAll(".rend")].filter(r => r.querySelector(".r_res")).map(r => {
      let size = r.querySelector(".r_res").value; if (size === "custom") size = `${r.querySelector(".r_w").value.trim()}x${r.querySelector(".r_h").value.trim()}${r.querySelector(".r_fit").checked ? ":fit" : ""}`;
      let rate = r.querySelector(".r_rate").value; if (rate === "custom") rate = r.querySelector(".r_rc").value.trim();
      return `${size?size+":":""}${r.querySelector(".r_codec").value}${rate?":"+rate:""}`; });
    if (!cfg.video.length) delete cfg.video;
  }
  if (v("a_codec")) cfg.audio = [`${v("a_codec")}:${$("#a_rate").value}`];
  for (const k of ["decoder","encoder","preset","profile","service_name","service_provider"]) if (v(k)) cfg[k] = v(k);
  if (v("bframes") !== "") cfg.bframes = Number(v("bframes"));
  if (v("gpu")) cfg.gpu = Number(v("gpu"));
  for (const k of ["delay","gop","vbv"]) if (num(k)) cfg[k] = num(k);
  for (const k of ["service_id","ts_id","onid","pmt_pid"]) { const n = pidNum(v(k)); if (n !== undefined) cfg[k] = n; }
  if (v("pcr_mode") === "video") cfg.pcr_pid = "video";
  else if (v("pcr_mode") === "pid" && v("pcr_pid") !== "") cfg.pcr_pid = pidNum(v("pcr_pid"));
  const remap = {};
  for (const r of pidRows) { const n = pidNum(r.out); if (n !== undefined && n !== r.in) remap[r.in] = n; }
  if (Object.keys(remap).length) cfg.remap = remap;
  if (pidOrdered && pidRows.length) cfg.order = pidRows.map(r => r.in);
  cfg.enabled = v("enabled") === "true";
  return cfg;
}
function setDirty(d) { dirty = d; $("#savebar").classList.toggle("hidden", !d); }
async function saveChannel() {
  const cfg = readForm();
  if (!cfg.input || cfg.input.endsWith("://")) { showMsg("A source address is needed.", "err"); return; }
  if (/^(srt|rist):\/\/[^?]*:(\?|$)/.test(cfg.input)) { showMsg("The SRT or RIST port is needed.", "err"); return; }
  if (/passphrase=[^&]{1,9}(&|$)/.test(cfg.input)) { showMsg("An SRT passphrase is 10 characters or more.", "err"); return; }
  for (const r of cfg.video || []) if (!/^((\d+|-1)x(\d+|-1)(:fit)?:)?(h264|hevc)(:\S+)?$/.test(r) || /^-1x-1/.test(r) || /-1[^:]*:fit/.test(r)) { showMsg("A custom size needs a width and a height (one of them -1 to follow the source's shape; fit needs both), and a bit rate like 2500k.", "err"); return; }
  {
    const bad = (k, lo, hi) => cfg[k] !== undefined && cfg[k] !== "video" && !(Number.isInteger(cfg[k]) && cfg[k] >= lo && cfg[k] <= hi);
    if (bad("service_id", 1, 65535) || bad("ts_id", 0, 65535) || bad("onid", 0, 65535)) { showMsg("Service number 1–65535; TS id and network id 0–65535.", "err"); return; }
    if (bad("pmt_pid", 32, 8190) || bad("pcr_pid", 32, 8190) || Object.values(cfg.remap || {}).some(p => !(Number.isInteger(p) && p >= 32 && p <= 8190))) { showMsg("Output PIDs are 32–8190 (0x20–0x1FFE).", "err"); return; }
    const outs = pidRows.map(r => pidNum(r.out) ?? r.in);
    if (new Set(outs).size !== outs.length) { showMsg("Two streams have the same output PID.", "err"); return; }
    if (cfg.pmt_pid !== undefined && outs.includes(cfg.pmt_pid)) { showMsg("The PMT PID is also a stream's PID.", "err"); return; }
    if (cfg.pmt_pid !== undefined && cfg.pcr_pid === cfg.pmt_pid) { showMsg("The PCR and the PMT cannot share a PID.", "err"); return; }
  }
  try { await api(`/api/channels/${encodeURIComponent(view.name)}`, {method:"PUT", body: JSON.stringify(cfg, null, 2) + "\n"}); setDirty(false); showMsg("Saved." + (current && current.state === "running" ? " The channel is restarting with the new settings." : ""), "ok"); schedule(800); }
  catch(e) { showMsg(e.message, "err"); }
}
async function act(what) {
  try { await api(`/api/channels/${encodeURIComponent(view.name)}/${what}`, {method:"POST"}); } catch(e) { showMsg(e.message, "err"); return; }
  schedule(500);
}
async function delChannel() {
  if (!confirm(`Delete channel ${view.name}? It is stopped and its settings removed.`)) return;
  try { await api(`/api/channels/${encodeURIComponent(view.name)}`, {method:"DELETE"}); dirty = false; chAt = 0; go("channels"); } catch(e) { showMsg(e.message, "err"); }
}
function newChannel() {
  const d = $("#dlg");
  d.innerHTML = `<h3>New channel</h3><div class="f"><label>Name</label><input id="n_name" placeholder="e.g. bet, cnn-hd (letters, digits, - and _)">
    <label>Source type</label><select id="n_kind">${IN_KINDS.filter(k => k[0] !== "file").map(k => `<option value="${k[0]}">${k[1]}</option>`).join("")}</select>
    <label>Source</label><div class="row"><input id="n_host" placeholder="239.5.5.5"><input id="n_port" class="n" placeholder="port"></div>
    <label>Will be</label><div class="urlprev" id="n_prev"></div>
    <div class="help">Everything else (program, backups, passphrases, transcoding) is set on the channel's page afterwards.</div></div>
    <div id="n_msg" style="margin-top:10px"></div><div class="actions"><button onclick="document.getElementById('dlg').close()">Cancel</button><button class="primary" id="n_go">Create channel</button></div>`;
  const nUrl = () => inputUrl({ kind: $("#n_kind").value, host: $("#n_host").value.trim(), port: $("#n_port").value.trim(), iface: "", src: "", latency: "", pass: "", secret: "", buffer: "", aes: "", extra: "" });
  const nSync = () => {
    const k = $("#n_kind").value;
    $("#n_port").style.display = k === "http" ? "none" : "";
    $("#n_host").placeholder = k === "http" ? "192.168.110.41/bet/mpegts (host[:port]/path)" : (k === "srtc" || k === "ristc") ? "sender's address" : (k === "srtl" || k === "ristl") ? "address to listen on, or blank for all" : "239.5.5.5 (address)";
    $("#n_prev").textContent = nUrl();
  };
  d.querySelectorAll("#n_kind,#n_host,#n_port").forEach(i => { i.oninput = nSync; i.onchange = nSync; }); nSync();
  $("#n_go").onclick = async () => {
    const name = $("#n_name").value.trim(), k = $("#n_kind").value, url = nUrl();
    if (k === "http" ? !$("#n_host").value.trim() : !$("#n_port").value.trim() || (!$("#n_host").value.trim() && !["srtl","ristl"].includes(k))) { $("#n_msg").innerHTML = `<div class="msg err">${k === "http" ? "The address is needed." : "Address and port are needed."}</div>`; return; }
    try { await api(`/api/channels/${encodeURIComponent(name)}`, {method:"PUT", body: JSON.stringify({input: url, enabled: false}, null, 2)}); d.close(); dirty = false; chAt = 0; go("channels", name); }
    catch(e) { $("#n_msg").innerHTML = `<div class="msg err">${esc(e.message)}</div>`; }
  };
  d.showModal(); $("#n_name").focus();
}

/* ---------- the pages ---------- */
function rerender() {
  if (view.page === "overview") renderOverviewPage();
  else if (view.page === "incidents") renderIncidentsPage();
  else if (view.page === "server") renderServer();
  else if (view.page === "settings") renderSettingsPage();
}
let tileStamp = 0;
function renderOverviewPage() {
  const main = $("#main");
  if (main.dataset.page !== "overview") {
    main.dataset.page = "overview";
    main.innerHTML = `<h2 class="sect">Now</h2><div class="now" id="ov_now"></div>
      <div class="find"><h2 class="sect">Channels</h2><a onclick="go('channels')">all channels and settings</a><div class="sp"></div>${filterBar("ov")}</div>
      <div class="tiles" id="ov_tiles"></div>
      <div class="cols"><div class="wide" id="ov_inc"></div><div class="side" id="ov_tech" style="max-width:360px"></div></div>`;
  }
  { const want = (sys && sys.open_incidents) || 0;
    loadIncidents(incAll && want !== incAll.filter(x => !x.closed && !x.parent).length && Date.now() - incAt > 3000); }
  loadTech();
  /* now */
  const st = (sys && sys.system) || {}, cpu = st.cpu || {}, mem = st.memory || {}, gpus = st.gpus || [];
  const memPct = mem.total_kb ? 100 * (mem.total_kb - (mem.available_kb || 0)) / mem.total_kb : 0;
  const counts = { ok: 0, warn: 0, bad: 0, off: 0 }; channels.forEach(c => counts[health(c)[0]]++);
  const run = counts.ok + counts.warn, open = (sys && sys.open_incidents) || 0;
  const disk = ((sys && sys.disks) || []).find(d => d.mount === "/") || ((sys && sys.disks) || [])[0];
  const inc24 = incAll ? incAll.filter(x => !x.parent).length : null;
  $("#ov_now").innerHTML = `
    <div class="t" onclick="go('channels')"><h4>Channels</h4><div class="big">${run} <small>on air</small></div><div class="sub">${[counts.warn ? `<span class="warn">${counts.warn} with trouble</span>` : "", counts.bad ? `<span class="bad">${counts.bad} failed</span>` : "", counts.off ? `${counts.off} stopped` : ""].filter(Boolean).join(" · ") || "all fine"}</div></div>
    <div class="t" onclick="go('incidents')"><h4>Incidents</h4><div class="big ${open ? "bad" : ""}">${open} <small>open</small></div><div class="sub">${inc24 == null ? "…" : `${inc24} in the last 24 hours`}</div></div>
    <div class="t" onclick="go('server')"><h4>Server</h4><div class="big">${(cpu.percent || 0).toFixed(0)}% <small>CPU</small></div><div class="sub">memory ${memPct.toFixed(0)}% · load ${(cpu.load1 || 0).toFixed(1)}</div></div>
    ${gpus.length ? `<div class="t" onclick="go('server')"><h4>Video cards</h4><div class="sub" style="margin-top:6px">${gpus.map(g => `card ${g.index}: <span class="mono">enc ${g.encoder >= 0 ? g.encoder + "%" : "—"} · dec ${g.decoder >= 0 ? g.decoder + "%" : "—"}</span>`).join("<br>")}</div></div>` : ""}
    ${disk ? (() => { const free = disk.total ? 100 * disk.avail / disk.total : 100; return `<div class="t" onclick="go('server')"><h4>Disk</h4><div class="big ${free < 5 ? "bad" : free < 15 ? "warn" : ""}">${fmtBytes(disk.avail)} <small>free</small></div><div class="sub"><span class="mono">${esc(disk.mount)}</span> is ${(100 - free).toFixed(0)}% used</div></div>`; })() : ""}`;
  /* the tiles: drawn when the channels change, then their figures in place */
  const shown = channels.filter(visible), tiles = $("#ov_tiles");
  const sig = shown.map(c => c.name + ":" + c.state).join(",");
  if (Date.now() - tileStamp > 30000) tileStamp = Date.now();
  if (tiles.dataset.sig !== sig) {
    tiles.dataset.sig = sig;
    tiles.innerHTML = shown.map(c => `<a class="tile" id="tile_${esc(c.name)}" onclick="openChannel('${esc(c.name)}')">
      <div class="pic">${c.state === "running" ? `<img loading="lazy" alt="" data-stamp="0" onerror="this.style.display='none'">` : c.state}</div>
      <div class="tb"><div class="tn"><span class="lamp"></span><b>${esc(c.name)}</b><span class="st"></span></div><div class="rates"></div><div class="why"></div></div></a>`).join("")
      || `<div class="empty">${channels.length ? "No channel matches." : "No channels yet. Make one on the Channels page."}</div>`;
  }
  for (const c of shown) {
    const t = document.getElementById("tile_" + c.name); if (!t) continue;
    const [h, why] = health(c), stt = c.stats || {}, inp = stt.input || {}, out = stt.output || {};
    t.className = "tile " + h;
    t.querySelector(".lamp").className = "lamp " + h;
    const sl = t.querySelector(".st"); sl.textContent = h === "ok" ? "On air" : h === "warn" ? "Trouble" : h === "bad" ? "Failed" : "Stopped"; sl.className = "st " + (h === "ok" ? "ok" : h === "off" ? "dim" : h);
    t.querySelector(".rates").textContent = c.state === "running" ? `${fmtRate(inp.bitrate)} → ${fmtRate(out.bitrate)}` : "—";
    t.querySelector(".why").textContent = h === "warn" || h === "bad" ? why : (c.config || {}).input || "";
    t.title = (c.config || {}).input || "";
    const img = t.querySelector("img");
    if (img && img.dataset.stamp !== String(tileStamp)) { img.dataset.stamp = String(tileStamp); img.style.display = ""; img.src = `/api/channels/${encN(c.name)}/thumb.jpg?t=${tileStamp}`; }
  }
  /* the latest incidents, and the technician */
  if (incAll) {
    const top = incAll.filter(x => !x.parent).slice(0, 6);
    $("#ov_inc").innerHTML = `<section class="card"><header><h2>Incidents, last 24 hours</h2><span class="hint">${open ? `<span class="bad">${open} open</span>` : "none open"}</span><div class="sp"></div><a onclick="go('incidents')">all incidents</a></header>
      ${top.length ? `<div class="tw">${incTable(top, true)}</div>` : `<div class="body"><div class="empty" style="padding:8px">No incidents in the last 24 hours.</div></div>`}</section>`;
  }
  if (techInfo && !techInfo.error) {
    const T = techInfo, V = T.verdicts || {}, states = { off: "resting", idle: "ready", starting: "loading the model", thinking: "looking at an incident", unavailable: "cannot run", disabled: "turned off" };
    $("#ov_tech").innerHTML = `<section class="card"><header><h2>Technician</h2></header><div class="body">
      <div style="display:flex;align-items:center;gap:8px"><span class="lamp ${T.state === "unavailable" ? "bad" : T.state === "disabled" || T.state === "off" ? "off" : "ok"}"></span><b>${esc(states[T.state] || T.state)}</b>${T.where ? `<span class="dim">on ${T.where === "cpu" ? "the CPU" : T.where === "all" ? "both cards" : "card " + esc(T.where.slice(3))}</span>` : ""}</div>
      <div class="dim mono" style="margin-top:4px;word-break:break-all">${esc(T.model)}</div>
      ${V.waiting_looked_at ? `<div style="margin-top:10px"><span class="warn">${V.waiting_looked_at} answer${V.waiting_looked_at > 1 ? "s" : ""} waiting for your verdict</span></div>` : ""}
      <div style="margin-top:10px"><a onclick="chatToggle()">Ask it something</a> · <a onclick="go('incidents')">its answers</a></div></div></section>`;
  }
}
function renderChannelsPage() {
  const main = $("#main");
  if (main.dataset.page !== "channels") {
    main.dataset.page = "channels";
    main.innerHTML = `<div class="cols"><div class="side"><div class="chlist" role="navigation" aria-label="Channels"><div class="flt">${filterBar("cl")}</div>
      <div class="items" id="chlist_items"></div><div class="foot"><button class="primary" onclick="newChannel()">New channel</button></div></div></div>
      <div class="wide" id="chanpane"></div></div>`;
  }
  renderChanList();
}
function renderIncidentsPage() {
  const main = $("#main");
  if (main.dataset.page !== "incidents") { main.dataset.page = "incidents"; main.innerHTML = `<div class="head"><h1>Incidents</h1><span class="state">the last 24 hours, with what the technician made of each; open one for its evidence and your verdict</span></div><div id="inc_body"></div>`; }
  loadIncidents(); loadWatchdog(); loadTech();
  $("#inc_body").innerHTML = (incAll ? incidentsCard(true) : `<div class="empty">Loading…</div>`) + watchdogCard("incidents") + techCard("incidents");
}
function renderSettingsPage() {
  const main = $("#main");
  if (main.dataset.page !== "settings") { main.dataset.page = "settings"; main.innerHTML = `<div class="head"><h1>Settings</h1><span class="state">for this server; each channel's own are on its page</span></div><div id="set_body"></div>`; }
  loadWatchdog(); loadTech(); loadPeers();
  $("#set_body").innerHTML = watchdogCard("settings") + techCard("settings") + peersCard()
    + (sys ? `<section class="card"><header><h2>This build</h2><span class="hint">caricoder3 ${esc(sys.version)}: the codecs and transports compiled in</span></header><div class="body"><pre class="log" style="border-radius:8px;max-height:none">${esc(sys.backends || "")}</pre></div></section>` : "");
}

/* ---------- loop ---------- */
async function refresh() {
  clearTimeout(timer);
  await loadAll();
  const p = view.page;
  if (p === "overview") renderOverviewPage();
  else if (p === "channels") { renderChannelsPage(); if (view.name) await renderChan(view.name); else renderChannelsTable(); }
  else if (p === "incidents") renderIncidentsPage();
  else if (p === "server") renderServer();
  else if (p === "settings") renderSettingsPage();
  reapplyHover();
  /* the channel page every 2 s; lists and the server every 3; incidents and settings now and then */
  schedule(p === "channels" ? (view.name ? 2000 : 3000) : p === "overview" || p === "server" ? 3000 : p === "incidents" ? 8000 : 30000);
}
themeBtn();
route();
</script>
