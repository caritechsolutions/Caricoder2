<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>try { if (localStorage.getItem("cc3theme") === "dark") document.documentElement.dataset.theme = "dark"; } catch(e) {}</script>
<title>caricoder3</title>
<style>
/* Light by default, dark on request (the header's switch); every colour is a token here. */
:root {
  --bg:#f4f6f8; --panel:#ffffff; --panel2:#f7f9fb; --line:#e1e6ec; --line2:#b9c1cc; --field:#ffffff; --code:#f1f4f7;
  --fg:#121722; --fg2:#2a3342; --dim:#4a5465;
  --acc:#1d5bbf; --acc-ink:#ffffff; --acc-soft:#e8eef9; --acc-strong:#123e87;
  --ok:#1e8e3e; --ok-ink:#17663a; --ok-soft:#e6f4ea;
  --warn:#b45309; --warn-ink:#8a4b00; --warn-soft:#fff1db;
  --bad:#c5221f; --bad-ink:#b3261e; --bad-soft:#fde7e5;
  --off:#6b7585; --off-soft:#e9ecf0;
  --air:#d97706; --g2:#8e44c9; --g3:#0f8fa3; --gap:#dfe4ea;
  --media:#1c2230; --media-ink:#aeb7c6;
  --shadow:0 6px 24px rgba(18,23,34,.12); --r:10px;
  color-scheme:light;
}
:root[data-theme="dark"] {
  --bg:#12171d; --panel:#1a2129; --panel2:#202933; --line:#2c3742; --line2:#465463; --field:#0f151b; --code:#0d1216;
  --fg:#eef2f6; --fg2:#c3ccd6; --dim:#9aa6b2;
  --acc:#6aa8ff; --acc-ink:#06213f; --acc-soft:#1d3550; --acc-strong:#a9cbff;
  --ok:#4cc38a; --ok-ink:#7fdcaa; --ok-soft:#173826;
  --warn:#e8b547; --warn-ink:#f0c76a; --warn-soft:#3a2f16;
  --bad:#ef6b57; --bad-ink:#ff9b8a; --bad-soft:#3b211c;
  --off:#7b8794; --off-soft:#27313b;
  --air:#f0a53a; --g2:#c58cf0; --g3:#6fd3e0; --gap:#2c3640;
  --media:#0d1216; --media-ink:#8b97a3;
  --shadow:0 6px 24px rgba(0,0,0,.45);
  color-scheme:dark;
}
* { box-sizing:border-box }
html,body { min-height:100% }
body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif }
a { color:var(--acc); text-decoration:none; cursor:pointer } a:hover { text-decoration:underline }
code, .mono { font-family:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace; font-size:13px }
button { font:inherit; font-size:14px; color:var(--fg); background:var(--panel); border:1px solid var(--line2); border-radius:8px; padding:8px 14px; min-height:38px; cursor:pointer }
button:hover { border-color:var(--fg2) } button:disabled { opacity:.45; cursor:default }
button.primary { background:var(--acc); border-color:var(--acc); color:var(--acc-ink); font-weight:600 }
button.danger { color:var(--bad-ink) } button.quiet { background:none; border-color:transparent; color:var(--fg2) } button.quiet:hover { color:var(--fg); border-color:var(--line2) }
input, select, textarea { font:inherit; font-size:14px; color:var(--fg); background:var(--field); border:1px solid var(--line2); border-radius:8px; padding:8px 10px; width:100%; min-width:0 }
input:focus, select:focus, textarea:focus, button:focus-visible, a:focus-visible { outline:2px solid var(--acc); outline-offset:1px }
select { appearance:none; -webkit-appearance:none; background-image:linear-gradient(45deg,transparent 50%,var(--fg2) 50%),linear-gradient(135deg,var(--fg2) 50%,transparent 50%); background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%; background-size:5px 5px; background-repeat:no-repeat; padding-right:28px }
.lamp { display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--off-soft); box-shadow:inset 0 0 0 2px var(--off); vertical-align:middle; flex:none }
.lamp.ok { background:var(--ok); box-shadow:none } .lamp.warn { background:var(--warn); box-shadow:none } .lamp.bad { background:var(--bad); box-shadow:none } .lamp.off { background:transparent; box-shadow:inset 0 0 0 2px var(--off) }
.warn { color:var(--warn-ink) } .bad { color:var(--bad-ink) } .ok { color:var(--ok-ink) } .dim { color:var(--dim) }

/* the top bar */
#top { background:var(--panel); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:15 }
#top .in { max-width:1440px; margin:0 auto; padding:10px 28px; display:flex; flex-wrap:wrap; align-items:center; gap:10px 24px }
#top .brand { display:flex; align-items:baseline; gap:10px; cursor:pointer } #top .brand b { font-size:19px; letter-spacing:-.01em } #top .brand span { color:var(--dim); font-size:13px }
#top nav { display:flex; flex-wrap:wrap; gap:4px; flex:1 1 auto }
#top nav a { padding:8px 14px; border-radius:8px; color:var(--fg2); font-weight:500; text-decoration:none } #top nav a:hover { background:var(--panel2) }
#top nav a.on { background:var(--acc-soft); color:var(--acc-strong); font-weight:600 }
#top nav a .n { margin-left:6px; font-size:12px; padding:0 7px; border-radius:999px; background:var(--bad); color:#fff }
#top .right { display:flex; align-items:center; gap:10px }
.pill { display:inline-flex; align-items:center; gap:8px; padding:6px 12px; border-radius:999px; font-weight:600; font-size:13px; white-space:nowrap }
.pill.ok { background:var(--ok-soft); color:var(--ok-ink) } .pill.warn { background:var(--warn-soft); color:var(--warn-ink) } .pill.bad { background:var(--bad-soft); color:var(--bad-ink) } .pill.off { background:var(--off-soft); color:var(--fg2) }
.pill .lamp { width:9px; height:9px }

/* the page */
main { max-width:1440px; margin:0 auto; padding:24px 28px 80px }
.head { display:flex; align-items:center; gap:14px; margin-bottom:18px; flex-wrap:wrap }
.head h1 { margin:0; font-size:26px; display:flex; align-items:center; gap:12px; letter-spacing:-.01em } .head .state { color:var(--fg2) } .head .sp { flex:1 }
h2.sect { margin:0 0 12px; font-size:13px; font-weight:600; color:var(--dim); text-transform:uppercase; letter-spacing:.06em }
.msg { padding:10px 14px; border-radius:8px; margin:0 0 14px } .msg.err { background:var(--bad-soft); color:var(--bad-ink) } .msg.ok { background:var(--ok-soft); color:var(--ok-ink) }
.back { color:var(--fg2); cursor:pointer; font-size:14px; margin-bottom:10px; display:inline-block } .back:hover { color:var(--fg) }
.cols { display:flex; flex-wrap:wrap; gap:24px; align-items:flex-start } .cols > .side { flex:1 1 240px; max-width:280px } .cols > .wide { flex:999 1 640px; min-width:0 }

/* the overview */
.now { display:grid; grid-template-columns:repeat(auto-fit, minmax(210px, 1fr)); gap:14px; margin-bottom:28px }
.now .t { background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:16px 18px; cursor:pointer } .now .t:hover { border-color:var(--line2) }
.now .t h4 { margin:0; font-weight:500; color:var(--dim); font-size:14px } .now .t .big { font-size:28px; font-weight:600; margin-top:2px } .now .t .big small { font-size:15px; font-weight:400; color:var(--dim) } .now .t .sub { font-size:14px; color:var(--dim) }
.tiles { display:grid; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); gap:14px; margin-bottom:28px }
.tile { display:block; background:var(--panel); border:1px solid var(--line); border-radius:var(--r); overflow:hidden; color:var(--fg); text-decoration:none; cursor:pointer }
.tile:hover { border-color:var(--acc); text-decoration:none } .tile.warn { border-color:var(--warn) } .tile.bad { border-color:var(--bad); border-width:2px } .tile.off { border-style:dashed }
.tile .pic { aspect-ratio:16/9; background:var(--media); color:var(--media-ink); display:flex; align-items:center; justify-content:center; font-size:13px; position:relative }
.tile .pic img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover }
.tile .tb { padding:12px 14px; display:flex; flex-direction:column; gap:4px }
.tile .tn { display:flex; align-items:center; gap:8px } .tile .tn b { font-size:17px } .tile .tn .st { margin-left:auto; font-size:13px; font-weight:600 }
.tile .rates { font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:14px } .tile .why { font-size:13px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.find { display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px; margin-bottom:12px } .find h2.sect { margin:0 } .find .sp { flex:1 } .find input { width:240px } .find select { width:170px }

/* the channel list beside a channel */
.chlist { background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:8px; position:sticky; top:76px; max-height:calc(100vh - 96px); display:flex; flex-direction:column }
.chlist .flt { display:flex; flex-direction:column; gap:6px; padding:4px 4px 8px } .chlist .items { overflow:auto; flex:1 }
.chlist .ch { display:grid; grid-template-columns:14px 1fr auto; gap:10px; align-items:center; padding:9px 10px; border-radius:8px; cursor:pointer; color:var(--fg2) }
.chlist .ch:hover { background:var(--panel2) } .chlist .ch.on { background:var(--acc-soft); color:var(--acc-strong) }
.chlist .ch b { font-weight:600; display:block } .chlist .ch i { font-style:normal; font-size:12px; color:var(--dim); display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:150px }
.chlist .ch .rate { font-size:12px; color:var(--dim); text-align:right; white-space:nowrap; font-family:"IBM Plex Mono",ui-monospace,monospace }
.chlist .foot { padding:8px 4px 2px; border-top:1px solid var(--line); margin-top:6px }
.chlist .foot button { width:100% }

.stat { display:grid; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr)); gap:12px }
.stat .box { background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:12px 14px } .stat .box h4 { margin:0 0 6px; font-weight:500; color:var(--dim); font-size:13px } .stat .box .big { font-size:24px; font-weight:600 } .stat .box .sub { color:var(--dim); font-size:13px; margin-top:4px }
.bar { height:6px; background:var(--line); border-radius:3px; margin-top:8px; overflow:hidden } .bar i { display:block; height:100%; background:var(--acc) } .bar i.warn { background:var(--warn) } .bar i.bad { background:var(--bad) }

/* signal path */
.path { display:grid; grid-template-columns:1fr 24px 1fr 24px 1fr; align-items:stretch; gap:0; margin-bottom:22px }
.path .node { background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; min-height:110px }
.path .node h3 { margin:0 0 6px; font-size:13px; font-weight:600; color:var(--dim) }
.path .node .big { font-size:24px; font-weight:600; line-height:1.15 } .path .node .sub { color:var(--fg2); font-size:13px; margin-top:4px }
.path .arrow { display:flex; align-items:center; justify-content:center; color:var(--line2); font-size:20px }
.path .node.bad { border-color:var(--bad) } .path .node .flag { color:var(--warn-ink) } .path .node .flag.bad { color:var(--bad-ink) }

section.card { background:var(--panel); border:1px solid var(--line); border-radius:var(--r); margin-bottom:18px }
section.card > header { display:flex; align-items:center; gap:12px; padding:14px 18px; border-bottom:1px solid var(--line); flex-wrap:wrap }
section.card > header h2 { margin:0; font-size:17px } section.card > header .hint { color:var(--dim); font-size:13px } section.card > header .sp { flex:1 }
section.card > .body { padding:16px 18px }
section.card.collapsed > .body { display:none } section.card > header .tog { cursor:pointer }

.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:12px 20px }
.kv b { display:block; font-weight:500; font-size:12px; color:var(--dim) } .kv span { font-size:15px }
.prog { border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-bottom:8px; cursor:pointer } .prog.on { border-color:var(--acc); background:var(--acc-soft) }
.tw { overflow-x:auto }
table { border-collapse:collapse; width:100% } th { text-align:left; font-weight:600; font-size:13px; color:var(--dim); padding:8px 12px; border-bottom:1px solid var(--line) }
td { padding:9px 12px; border-bottom:1px solid var(--line); vertical-align:middle } tr:last-child td { border-bottom:none }
table.rows tbody tr { cursor:pointer } table.rows tbody tr:hover td { background:var(--panel2) }

/* forms */
.f { display:grid; grid-template-columns:170px minmax(0,1fr); gap:12px 16px; align-items:center; max-width:900px }
.f label { color:var(--fg2) } .f .help { grid-column:2; color:var(--dim); font-size:13px; margin-top:-8px }
.f .row { display:flex; gap:8px; align-items:center } .f .row > * { flex:1 } .f .row .n { flex:0 0 90px } .f .row .x { flex:0 0 auto }
.rend { display:grid; grid-template-columns:1fr 1fr 1fr auto; gap:8px; align-items:center; margin-bottom:8px }
.rend .custom { display:flex; gap:6px; align-items:center } .rend .custom input { width:70px } .rend .custom span { color:var(--dim) }
.choice { display:inline-flex; border:1px solid var(--line2); border-radius:8px; overflow:hidden }
.choice button { border:none; border-radius:0; background:none; padding:7px 14px; min-height:34px; color:var(--fg2) } .choice button.on { background:var(--acc-soft); color:var(--acc-strong); font-weight:600 }
.savebar { position:sticky; bottom:0; margin-top:14px; background:var(--panel); border:1px solid var(--line2); border-radius:8px; padding:10px 14px; display:flex; gap:10px; align-items:center; box-shadow:var(--shadow) }
.savebar .sp { flex:1 } .savebar.hidden { display:none }
pre.log { margin:0; padding:12px 14px; background:var(--code); border-radius:0 0 var(--r) var(--r); font:12.5px/1.55 "IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace; max-height:380px; overflow:auto; white-space:pre-wrap; color:var(--fg2) }
dialog { background:var(--panel); color:var(--fg); border:1px solid var(--line2); border-radius:12px; padding:22px; width:600px; max-width:95vw; box-shadow:var(--shadow) } dialog::backdrop { background:rgba(10,14,20,.55) }
dialog h3 { margin:0 0 14px; font-size:19px } dialog .actions { display:flex; justify-content:flex-end; gap:8px; margin-top:16px }
.urlprev { background:var(--code); border:1px dashed var(--line2); border-radius:8px; padding:8px 10px; color:var(--fg2); word-break:break-all }
.empty { padding:36px 20px; text-align:center; color:var(--dim) }
.thumb { width:96px; height:54px; object-fit:cover; border-radius:4px; background:var(--media); display:block } .thumb.off { opacity:.35 } td.thumbcell { width:96px; padding:4px 0 4px 10px }
.pvbox { position:relative; width:100%; aspect-ratio:16/9; background:var(--media); border-radius:6px; overflow:hidden; margin-bottom:8px }
.pvbox img, .pvbox video { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; display:block; background:#000 }
.pvplay { position:absolute; left:50%; top:50%; width:58px; height:58px; min-height:0; margin:-29px 0 0 -29px; border-radius:50%; background:rgba(10,14,18,.65); border:2px solid rgba(255,255,255,.85); padding:0 }
.pvplay::after { content:""; position:absolute; left:22px; top:16px; border-style:solid; border-width:13px 0 13px 20px; border-color:transparent transparent transparent #fff }
.pvplay:hover { background:rgba(29,91,191,.8); border-color:#fff } .pvplay:disabled { display:none }
.pvplay.busy { pointer-events:none; border-color:rgba(255,255,255,.25); border-top-color:#fff; animation:spin 1s linear infinite } .pvplay.busy::after { display:none }
@keyframes spin { to { transform:rotate(360deg) } }
.pvmsg { position:absolute; left:0; right:0; bottom:0; padding:6px 10px; background:rgba(0,0,0,.72); font-size:12px; color:#e6ebf0 } .pvmsg.bad { color:#ffc2b6 }
.pvctl { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-bottom:8px } .pvctl button { padding:4px 10px; min-height:32px; font-size:13px } .pvctl select { flex:1 1 140px; width:auto; padding:4px 26px 4px 8px; font-size:13px }
.streams { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.2fr); gap:20px } @media (max-width:1000px) { .streams { grid-template-columns:1fr } }
.media { display:grid; grid-template-columns:1fr 1fr; gap:14px } .media h4 { margin:0 0 6px; font-size:13px; font-weight:600; color:var(--dim) }
.sline { display:grid; grid-template-columns:1fr auto; gap:0 10px; padding:7px 0; border-bottom:1px solid var(--line); font-size:14px } .sline:last-child { border-bottom:none }
.sline b { font-weight:600; text-transform:capitalize } .sline .pid { grid-column:1 / -1; color:var(--dim); font-size:12.5px } .sline span:not(.pid) { color:var(--fg2); white-space:nowrap }
.k-video { color:var(--acc) } .k-audio { color:var(--ok-ink) } .k-subtitles, .k-teletext { color:var(--warn-ink) } .k-data { color:var(--fg2) }
.legend { display:flex; flex-wrap:wrap; gap:6px 16px; align-items:center; font-size:13px; margin-bottom:4px } .legend i { display:inline-block; width:14px; height:3px; border-radius:2px; vertical-align:middle; margin-right:6px } .legend .li i { background:var(--air) } .legend .lo i { background:var(--ok) } .legend .hint { color:var(--dim); margin-left:auto }
svg.graph { width:100%; height:auto; display:block } svg.graph .grid line { stroke:var(--line); stroke-width:1 } svg.graph .grid text { fill:var(--dim); font-size:11px; font-family:inherit }
svg.graph polyline { fill:none; stroke-width:2; stroke-linejoin:round } svg.graph .gin { stroke:var(--air) } svg.graph .gout { stroke:var(--ok) }
.gwrap { position:relative } .gtip { display:none; position:absolute; top:6px; pointer-events:none; background:var(--panel); border:1px solid var(--line2); border-radius:8px; padding:7px 10px; font-size:13px; line-height:1.55; min-width:160px; box-shadow:var(--shadow); z-index:5 }
.gtip .tt { color:var(--fg2); margin-bottom:2px } .gtip b { font-weight:600; margin-left:auto; padding-left:14px } .gtip div { display:flex; align-items:center; gap:6px } .gtip i { width:10px; height:3px; border-radius:2px; display:inline-block }
.gtip i.gin { background:var(--air) } .gtip i.gout { background:var(--ok) } .gtip i.gdec { background:var(--acc) } .gtip i.gg2 { background:var(--g2) } .gtip i.gg3 { background:var(--g3) } .gtip .dim { color:var(--dim) } .gtip .bad { color:var(--bad-ink) }
.stat.disks { grid-template-columns:repeat(auto-fill, minmax(420px, 1fr)) } .stat.disks .mono { word-break:break-all }
table.chat tr.out td:last-child { color:var(--fg2) } table.chat td:nth-child(2) { white-space:nowrap }
#chat { position:fixed; right:0; top:0; bottom:0; width:440px; max-width:100vw; background:var(--panel); border-left:1px solid var(--line2); z-index:30; display:none; flex-direction:column; box-shadow:var(--shadow) }
#chat.on { display:flex } #chat header { display:flex; gap:10px; align-items:baseline; padding:14px 16px; border-bottom:1px solid var(--line) } #chat header button { margin-left:auto; font-size:18px; padding:0 10px; min-height:32px }
#chatlog { flex:1; overflow:auto; padding:12px 14px; display:flex; flex-direction:column; gap:10px } .cm { max-width:88% } .cm.me { align-self:flex-end; text-align:right }
.cm .who { font-size:12px; color:var(--dim); margin-bottom:2px } .cm .txt { white-space:pre-wrap; line-height:1.5; background:var(--panel2); border:1px solid var(--line); padding:8px 11px; border-radius:10px; font-size:14px; text-align:left } .cm.me .txt { background:var(--acc-soft); border-color:transparent }
#chat form { display:flex; gap:8px; padding:12px; border-top:1px solid var(--line) } #chat textarea { flex:1; resize:none }
.verdict { margin-top:10px; display:flex; gap:6px; align-items:center; flex-wrap:wrap } .verdict #vform { flex-basis:100% }
.tech .cause { font-size:16px; font-weight:600 } .tech p { margin:6px 0; line-height:1.5 } .tech ul { margin:2px 0 6px 18px; padding:0 } pre.ticket { white-space:pre-wrap; background:var(--code); padding:8px 10px; border-radius:6px; font-size:13px; margin:4px 0 }
img.evpic { max-width:240px; border-radius:6px; display:block } table.evtab td { vertical-align:top } .tools { display:flex; gap:6px; flex-wrap:wrap; align-items:center } .tools .toolnote { font-size:13px; margin-left:6px }
svg.graph .cursor { stroke:var(--fg2); stroke-width:1; stroke-dasharray:3 3 }
svg.graph .gdec { stroke:var(--acc) } svg.graph .gg2 { stroke:var(--g2) } svg.graph .gg3 { stroke:var(--g3) } svg.graph .gap { fill:var(--gap); opacity:.8 } svg.graph .mark { stroke:var(--bad); stroke-width:2 }
.legend .gin-l i { background:var(--air) } .legend .gout-l i { background:var(--ok) } .legend .gdec-l i { background:var(--acc) } .legend .gg2-l i { background:var(--g2) } .legend .gg3-l i { background:var(--g3) }
.evwrap { max-height:340px; overflow:auto; border:1px solid var(--line); border-radius:8px } table.evt td { padding:7px 12px; font-size:14px; vertical-align:top } table.evt td.mono { white-space:nowrap; color:var(--fg2) }
tr.lv-warn td:last-child { color:var(--warn-ink) } tr.lv-error td:last-child { color:var(--bad-ink) }
table.inctab tr { cursor:pointer } table.inctab tr:hover td { background:var(--panel2) } table.inctab tr.child td { font-size:13px; padding-top:3px; padding-bottom:3px }
table.inctab tr:not(.open) td:last-child { color:var(--fg2) } table.inctab td:first-child { width:18px }
table.kv td { padding:4px 12px 4px 0; font-size:14px; vertical-align:top } table.kv td:first-child { color:var(--dim); white-space:nowrap; width:150px }
h4.sub4 { margin:18px 0 6px; font-size:13px; font-weight:600; color:var(--dim) }
.rulechecks { display:grid; grid-template-columns:1fr 1fr; gap:6px 16px; font-size:14px } .rulechecks label { display:flex; gap:8px; align-items:center; justify-content:flex-start; text-align:left; color:var(--fg) }

<body>
<header id="top"><div class="in">
  <div class="brand" onclick="go('overview')" title="Overview"><b>caricoder3</b><span id="sysline">connecting…</span></div>
  <nav aria-label="Pages">
    <a data-p="overview" onclick="go('overview')">Overview</a>
    <a data-p="channels" onclick="go('channels')">Channels</a>

  </nav>

</div></header>
<main id="main"></main>
<dialog id="dlg"></dialog>
<aside id="chat"><header><b>The technician</b><span class="dim">offline, on this server</span><button class="quiet" onclick="chatToggle()" aria-label="Close">×</button></header>
  <div id="chatlog"></div>
  <form onsubmit="event.preventDefault(); chatSend()"><textarea id="chatq" rows="2" placeholder="Ask in plain words…" onkeydown="if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); chatSend(); }"></textarea><button class="primary">Ask</button></form></aside>

<script>
"use strict";
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtRate = b => !b ? "—" : b >= 1e6 ? (b/1e6).toFixed(2)+" Mb/s" : b >= 1e3 ? (b/1e3).toFixed(0)+" kb/s" : (b|0)+" b/s";
const fmtUp = s => { s = Math.floor(s||0); const d=Math.floor(s/86400), h=Math.floor(s%86400/3600), m=Math.floor(s%3600/60); return d ? `${d}d ${h}h` : h ? `${h}h ${m}m` : `${m}m ${s%60}s`; };
const sleep = ms => new Promise(r => setTimeout(r, ms));

const RES = [["", "Same as source"],
  ["-1x1080","1080 high, width from the source's shape"], ["-1x720","720 high, width from the source's shape"], ["-1x540","540 high, width from the source's shape"], ["-1x480","480 high, width from the source's shape"], ["-1x360","360 high, width from the source's shape"], ["-1x240","240 high, width from the source's shape"],
  ["1920x1080:fit","Fit inside 1920 × 1080"], ["1280x720:fit","Fit inside 1280 × 720"], ["854x480:fit","Fit inside 854 × 480"],
  ["1920x1080","Exactly 1920 × 1080"], ["1280x720","Exactly 1280 × 720"], ["960x540","Exactly 960 × 540"], ["854x480","Exactly 854 × 480"], ["640x360","Exactly 640 × 360"], ["426x240","Exactly 426 × 240"], ["custom","Custom…"]];
const VBR = ["400k","600k","800k","1M","1.5M","2M","2.5M","3M","4M","5M","6M","8M","10M","12M"];
const ABR = ["64k","96k","128k","160k","192k","256k","320k","384k"];
const MUX = [["", "Variable (no padding)"], ["2M","2 Mb/s"],["3M","3 Mb/s"],["4M","4 Mb/s"],["5M","5 Mb/s"],["6M","6 Mb/s"],["8M","8 Mb/s"],["10M","10 Mb/s"],["12M","12 Mb/s"],["15M","15 Mb/s"],["20M","20 Mb/s"],["custom","Custom…"]];

let view = { name: null, page: "overview" }, timer = null, sys = null, channels = [], dirty = false, logOpen = false, setOpen = false, sysAt = 0, chAt = 0;
let filt = { q: "", st: "" };
try { filt = Object.assign(filt, JSON.parse(localStorage.getItem("cc3filter") || "{}")); } catch(e) {}
function setFilter(from) { const q = $("#" + from + "_q"), st = $("#" + from + "_st");
  filt = { q: q ? q.value.trim().toLowerCase() : filt.q, st: st ? st.value : filt.st }; try { localStorage.setItem("cc3filter", JSON.stringify(filt)); } catch(e) {}
  if (view.page === "overview") renderOverviewPage(); else if (view.page === "channels") { renderChanList(); if (!view.name) renderChannelsTable(); } }
function visible(c) { return (!filt.q || c.name.toLowerCase().includes(filt.q)) && (!filt.st || health(c)[0] === filt.st); }
function leaveOk() { if (dirty && !confirm("Leave without saving the changes?")) return false; dirty = false; closePreview(); return true; }
/* pages: #/overview, #/channels, #/channels/NAME, #/incidents, #/server, #/settings */
function go(page, name) {
  if (!leaveOk()) return;
  const h = "#/" + page + (name ? "/" + encodeURIComponent(name) : "");
  if (location.hash !== h) history.pushState(null, "", h);
  route();
}
function goList() { go("channels"); }
function goServer() { go("server"); }
function route() {
  const m = /^#\/(overview|channels|incidents|server|settings)(?:\/(.+))?$/.exec(location.hash || "");
  const page = m ? m[1] : "overview", name = m && m[2] ? decodeURIComponent(m[2]) : null;
  if (page !== view.page || name !== view.name) { closePreview(); $("#main").dataset.page = ""; $("#main").dataset.chan = ""; }
  view = { page, name: page === "channels" ? name : null };
  document.querySelectorAll("#top nav a").forEach(a => a.classList.toggle("on", a.dataset.p === page));
  sysAt = chAt = 0;
  refresh();
}
window.addEventListener("popstate", () => { if (dirty && !confirm("Leave without saving the changes?")) { history.pushState(null, "", "#/channels/" + encodeURIComponent(view.name || "")); return; } dirty = false; route(); });
function toggleTheme() {
  const dark = document.documentElement.dataset.theme !== "dark";
  if (dark) document.documentElement.dataset.theme = "dark"; else delete document.documentElement.dataset.theme;
  try { localStorage.setItem("cc3theme", dark ? "dark" : "light"); } catch(e) {}
  themeBtn();
}
function themeBtn() { const b = $("#themebtn"); if (b) b.textContent = document.documentElement.dataset.theme === "dark" ? "Light" : "Dark"; }
const prevCounters = {};   // per channel: the error counters at the last poll, to see what is still happening

/* The lamp: green = running and healthy, yellow = running with trouble
 * (no input, errors in the last few seconds, a transcoder failed, not
 * keeping up), red = failed to run, grey = stopped. Returns [class, why]. */
function health(c) {
  if (c._health) return c._health;        /* once per poll, so rail and page agree */
  return c._health = healthOf(c);
}
/* black / frozen picture, silent audio, streams without data: as the channel says (10 s and more) */
function contentFaults(st) {
  const ct = st.content || {}, pic = ct.picture, out = [], inp = st.input || {};
  if (!(inp.last_packet_age_ms >= 0 && inp.last_packet_age_ms < 1000 && inp.bitrate > 0)) return out;   /* no input says it all */
  if (pic && pic.age_ms < 30000) {
    if (pic.black_ms >= 10000) out.push(`picture black ${Math.round(pic.black_ms / 1000)} s`);
    if (pic.frozen_ms >= 10000) out.push(`picture frozen ${Math.round(pic.frozen_ms / 1000)} s`);
  }
  const ss = (st.service || {}).streams || [];
  for (const a of ct.audio || []) if (a.silent_ms >= 10000) {
    const s = ss.find(x => x.in_pid === a.pid && !x.from_pid);
    out.push(`audio${s && s.language ? " " + s.language.toUpperCase() : ""} silent ${Math.round(a.silent_ms / 1000)} s`);
  }
  for (const s of ss) if (!s.from_pid && s.idle_ms >= 5000 && (s.kind === "video" || s.kind === "audio"))
    out.push(`${s.kind}${s.language ? " " + s.language.toUpperCase() : ""} has no data`);
  return out;
}
function healthOf(c) {
  if (c.state === "failed") return ["bad", c.why || "failed"];
  if (c.state !== "running") return ["off", c.state];
  const st = c.stats; if (!st) return ["warn", "starting"];
  const inp = st.input||{}, out = st.output||{}, clk = st.clock||{}, svc = st.service||{};
  const outs = ((c.outputs && c.outputs.outputs) || []).filter(o => o.id !== "pvtap" && !/^evrec/.test(o.id));
  const now = { cc: inp.cc_errors||0, ovf: inp.socket_overflow||0, drop: out.dropped_units||0, late: out.late_units||0, lost: (inp.link||{}).lost||0,
                send: outs.reduce((a,o)=>a+(o.errors||0)+(o.overruns||0),0), xdrop: (svc.streams||[]).reduce((a,s)=>a+(s.input_dropped||0),0) };
  const was = prevCounters[c.name] || now;
  prevCounters[c.name] = now;
  const why = [];
  if (inp.last_packet_age_ms > 2000 || (st.uptime_s > 10 && !inp.bitrate)) why.push("no input");
  if ((svc.streams||[]).some(s => s.failed)) why.push("a transcoder failed");
  if (st.uptime_s > 15 && !clk.locked) why.push("clock not locked");
  if (now.cc > was.cc) why.push("input errors");
  if (now.ovf > was.ovf) why.push("input overflow");
  if (now.lost > was.lost) why.push("packets lost on the link");
  if (inp.active) why.push("running on a backup source");
  if (now.drop > was.drop || now.xdrop > was.xdrop) why.push("dropping");
  if (now.late > was.late) why.push("running late");
  if (now.send > was.send) why.push("send errors");
  contentFaults(st).forEach(f => why.push(f));
  return why.length ? ["warn", why.join(", ")] : ["ok", "healthy"];
}

async function api(path, opts={}) {
  const r = await fetch(path, Object.assign({headers:{"Content-Type":"application/json"}}, opts));
  let j = null; try { j = await r.json(); } catch(e) {}
  if (!r.ok || (j && j.ok === false)) throw new Error((j && j.error) || (r.status + " " + r.statusText));
  return j;
}
function schedule(ms) { clearTimeout(timer); timer = setTimeout(refresh, ms); }
function showMsg(text, cls) { const m = $("#msg"); if (m) m.innerHTML = `<div class="msg ${cls}">${esc(text)}</div>`; }

/* ---------- data ---------- */
/* The server's state: every few seconds where it is shown (Overview, Server),
 * else now and then for the header. Channels: the short list (?brief=1)
 * where channels are listed, nothing elsewhere. */
async function loadAll() {
  const p = view.page, sysEvery = p === "server" || p === "overview" ? 3000 : 15000;
  if (!sys || Date.now() - sysAt >= sysEvery) {
    sysAt = Date.now();
    try { sys = await api("/api/system"); } catch(e) { sys = null; }
  }
  const chEvery = p === "overview" ? 3000 : p === "channels" ? (view.name ? 5000 : 3000) : 0;
  if (chEvery && Date.now() - chAt >= chEvery) {
    chAt = Date.now();
    try { const j = await api("/api/channels?brief=1"); channels = j.channels; channels.forEach(c => c._health = null); } catch(e) { channels = []; }
  }
  $("#sysline").textContent = sys ? `${sys.host} · ${sys.version}` : "cannot reach the supervisor";
  statusPill();
}
function statusPill() {
  const el = $("#statuspill"); if (!el) return;
  const nav = $("#nav_inc");
  if (!sys) { el.innerHTML = `<span class="pill bad"><span class="lamp bad"></span>Cannot reach the supervisor</span>`; return; }
  const open = sys.open_incidents || 0, failed = sys.failed || 0;
  if (nav) { nav.textContent = open; nav.style.display = open ? "" : "none"; }
  const trouble = channels.filter(c => health(c)[0] === "warn").length;
  const [cls, text] = failed ? ["bad", `${failed} channel${failed > 1 ? "s" : ""} failed`] : open ? ["warn", `${open} incident${open > 1 ? "s" : ""} open`]
    : trouble ? ["warn", `${trouble} channel${trouble > 1 ? "s" : ""} with trouble`] : sys.running ? ["ok", sys.running === sys.channels ? "All channels on air" : `${sys.running} of ${sys.channels} on air`] : ["off", "No channel running"];
  el.innerHTML = `<span class="pill ${cls}" title="${esc(sys.running + " of " + sys.channels + " running · up " + fmtUp(sys.uptime))}"><span class="lamp ${cls}"></span>${esc(text)}</span>`;
}
function filterBar(from) {
  return `<input id="${from}_q" type="search" placeholder="Find a channel or source" value="${esc(filt.q)}" oninput="setFilter('${from}')" aria-label="Find a channel">
    <select id="${from}_st" onchange="setFilter('${from}')" aria-label="Show">${[["", "All channels"], ["ok", "Running fine"], ["warn", "With trouble"], ["bad", "Failed"], ["off", "Stopped"]].map(o => `<option value="${o[0]}" ${filt.st === o[0] ? "selected" : ""}>${o[1]}</option>`).join("")}</select>`;
}
/* the list beside a channel: drawn once, then only its rows */
function renderChanList() {
  const el = $("#chlist_items"); if (!el) return;
  const shown = channels.filter(visible);
  el.innerHTML = shown.map(c => {
    const st = c.stats || {}, inp = st.input || {}, out = st.output || {};
    const [h, why] = health(c);
    return `<a class="ch ${view.name===c.name?"on":""}" onclick="openChannel('${esc(c.name)}')" ${view.name===c.name?'aria-current="page"':""}>
      <span class="lamp ${h}" title="${esc(why)}"></span>
      <div><b>${esc(c.name)}</b><i>${esc(c.state==="running" && h !== "ok" ? why : c.state === "running" ? "up " + fmtUp(c.uptime) : c.state)}</i></div>
      <div class="rate">${c.state==="running" ? `${fmtRate(inp.bitrate)}<br>${fmtRate(out.bitrate)}` : ""}</div></a>`;
  }).join("") || `<div class="empty" style="padding:16px">${channels.length ? "No channel matches." : "No channels yet."}</div>`;
}
function renderRail() { renderChanList(); }
function openChannel(name) { go("channels", name); }

/* ---------- overview (no channel chosen) ---------- */
function renderChannelsTable() {
  const pane = $("#chanpane"); if (!pane) return;
  const shown = channels.filter(visible);
  const rows = shown.map(c => { const st=c.stats||{}, inp=st.input||{}, out=st.output||{}, svc=st.service||{};
    const what = (svc.streams||[]).map(s => s.mode==="transcode" ? `${s.from||""} → ${s.codec||""}${s.size?" "+s.size:""}` : `${s.codec||""} copy`).join(", ");
    const outs = (c.outputs && c.outputs.outputs) || [];
    const [h, why] = health(c);
    return `<tr onclick="openChannel('${esc(c.name)}')"><td><span class="lamp ${h}"></span> <b>${esc(c.name)}</b></td><td>${esc(c.state)}${h==="warn"?` <span class="warn">${esc(why)}</span>`:c.why&&c.state!=="running"?` <span class="bad">${esc(c.why)}</span>`:""}</td><td class="mono">${esc((c.config||{}).input||"")}</td><td class="mono">${c.state==="running"?fmtRate(inp.bitrate):"—"}</td><td class="mono">${c.state==="running"?fmtRate(out.bitrate):"—"}</td><td style="color:var(--fg2)">${esc(what)}</td></tr>`; }).join("");
  const counts = { ok:0, warn:0, bad:0, off:0 }; channels.forEach(c => counts[health(c)[0]]++);
  pane.innerHTML = `<div class="head"><h1>Channels</h1><span class="state">${channels.length ? `${counts.ok} fine · ${counts.warn} with trouble · ${counts.bad} failed · ${counts.off} stopped${shown.length !== channels.length ? ` · showing ${shown.length} of ${channels.length}` : ""}` : ""}</span><div class="sp"></div></div>
    <section class="card"><div class="tw"><table class="rows"><thead><tr><th>Channel</th><th>State</th><th>Source</th><th>In</th><th>Out</th><th>Processing</th></tr></thead>
    <tbody>${rows || `<tr><td colspan="6" class="empty">${channels.length ? "No channel matches the filter." : "No channels yet. \"New channel\" makes one: give it a name and a source, and it is ready to be set up."}</td></tr>`}</tbody></table></div></section>`;
}
function renderOverview() { renderOverviewPage(); }

let thumbStamp = 0;   // fixed when a channel page is opened: the picture is fetched once, not refreshed
const thumbUrl = name => `/api/channels/${encodeURIComponent(name)}/thumb.jpg?t=${thumbStamp}`;

/* ---------- the preview player ----------
 * It lives in the Source box, where the snapshot is: the snapshot is the
 * poster until play is pressed. "Preview" is a small H.264 copy made for
 * the purpose (426x240, 300 kb/s, 1 s segments: quick to start, plays in
 * any browser, one audio chosen from the channel's); "Original" plays the
 * channel's own stream through a temporary HLS output with 10 s segments. */
let pv = null, pvGen = 0;          // pv: {name, mode, gen, hls, temp, drop}
const pvAudio = {};                // per channel: the audio stream chosen (output PID)
let pvCtlSig = "";
function loadHls() {
  if (window.Hls) return Promise.resolve();
  return new Promise((ok, bad) => { const sc = document.createElement("script"); sc.src = "/hls.min.js"; sc.onload = ok; sc.onerror = () => bad(new Error("the player script did not load")); document.head.appendChild(sc); });
}
const encN = n => encodeURIComponent(n);
function audioStreams(c) { return (((c.stats||{}).service||{}).streams||[]).filter(s => s.kind === "audio" && !s.from_pid); }
/* The streams the preview leaves out: every audio but the chosen one. The
 * preview reads the channel's source when it is multicast (input PIDs, and
 * the channel's own drop list), else a loopback copy of the channel's
 * output (output PIDs). */
function pvDrop(c) {
  const cfg = c.config || {}, fromInput = /^(udp|rtp):\/\/@?((22[4-9]|23\d)\.|\[ff)/i.test(cfg.input || "");   // as the supervisor decides
  const aud = audioStreams(c), chosen = pvChosen(c);
  const drop = aud.filter(s => s.pid !== chosen).map(s => fromInput ? s.in_pid : s.pid);
  if (fromInput) (cfg.drop || []).forEach(p => { if (!drop.includes(p)) drop.push(p); });
  return drop;
}
function pvChosen(c) { const aud = audioStreams(c); const want = pvAudio[c.name]; return aud.some(s => s.pid === want) ? want : (aud[0] || {}).pid; }
function pvShow(state, text) {
  const v = $("#pv"), poster = $("#pv_poster"), ov = $("#pv_over"), m = $("#pv_msg");
  if (!v) return;
  v.style.display = state === "playing" ? "" : "none";
  poster.style.display = state === "playing" ? "none" : "";
  ov.style.display = state === "playing" ? "none" : "";
  ov.classList.toggle("busy", state === "loading");
  m.textContent = text || ""; m.style.display = text ? "" : "none";
  m.classList.toggle("bad", state === "error");
  pvCtlSig = ""; if (current) renderPvCtl(current);
}
async function waitSegments(url, gen, need, tries) {
  for (let i = 0; i < tries && pv && pv.gen === gen; i++) {
    try {
      const r = await fetch(url, {cache: "no-store"});
      if (r.ok) {
        const top = await r.text();
        // one rendition: index.m3u8 is the media playlist itself; several: it lists them
        const first = top.includes("#EXTINF") ? null : top.split("\n").map(l => l.trim()).find(l => l && !l.startsWith("#"));
        const media = first ? await (await fetch(url.replace(/index\.m3u8$/, first), {cache: "no-store"})).text() : top;
        if ((media.match(/#EXTINF/g) || []).length >= need) return true;
      }
    } catch(e) {}
    await sleep(400);
  }
  return false;
}
async function pvStartPreviewProcess(name, gen, drop) {
  const r = await api(`/api/channels/${encN(name)}/preview`, {method: "POST", body: JSON.stringify({drop})});
  const want = drop.join(",");
  // a restart for another audio: wait until the new process is the one running
  for (let i = 0; i < 60 && pv && pv.gen === gen; i++) {
    const p = ((await api(`/api/channels/${encN(name)}`)).channel || {}).preview || {};
    if (p.running && p.drop === want) break;
    if (!p.running && p.why && i > 12) throw new Error("the preview stopped: " + p.why);
    await sleep(250);
  }
  return r.url;
}
async function pvPlay(mode) {
  const c = current;
  if (!c || c.state !== "running") return;
  pvStop(false, mode === "preview");   // the preview process is kept: a POST restarts it if the audio changed
  const name = c.name, gen = ++pvGen;
  pv = { name, mode, gen, hls: null, temp: false, drop: null };
  pvShow("loading", mode === "preview" ? "Starting the preview…" : "Waiting for the first segments (10 s each)…");
  let url;
  try {
    await loadHls();
    if (mode === "preview") {
      const drop = pvDrop(c);
      pv.drop = drop;
      url = await pvStartPreviewProcess(name, gen, drop);
    } else {
      const outs = (c.outputs && c.outputs.outputs) || [];
      pv.temp = !outs.some(o => o.type === "hls" && o.id !== "preview");
      if (pv.temp && !outs.some(o => o.id === "preview"))
        await api(`/api/channels/${encN(name)}/outputs`, {method: "POST", body: JSON.stringify({url: "hls://?segment=10&window=4", id: "preview", save: false})});
      url = `/hls/${encN(name)}/index.m3u8`;
    }
    if (!pv || pv.gen !== gen) return;
    if (!await waitSegments(url, gen, mode === "preview" ? 3 : 2, mode === "preview" ? 75 : 150)) {
      if (pv && pv.gen === gen) pvShow("error", mode === "preview" ? "The preview made no video in 30 s (is the source delivering?)." : "No segments after 60 s: the channel is not producing video (see its log).");
      return;
    }
  } catch(e) { if (pv && pv.gen === gen) pvShow("error", e.message); return; }
  if (!pv || pv.gen !== gen) return;
  const video = $("#pv");
  if (Hls.isSupported()) {
    const hls = new Hls(mode === "preview"
      ? { liveSyncDurationCount: 3, liveMaxLatencyDurationCount: 10, maxBufferLength: 10, maxMaxBufferLength: 20, manifestLoadingRetryDelay: 500, levelLoadingRetryDelay: 500, fragLoadingRetryDelay: 500 }
      : { liveSyncDurationCount: 3, liveMaxLatencyDurationCount: 8, maxBufferLength: 20, maxMaxBufferLength: 30, manifestLoadingRetryDelay: 1000, levelLoadingRetryDelay: 1000, fragLoadingRetryDelay: 1000 });
    pv.hls = hls;
    hls.on(Hls.Events.ERROR, async (ev, data) => {
      if (!data.fatal || !pv || pv.hls !== hls) return;
      if (data.type === Hls.ErrorTypes.MEDIA_ERROR && /codec|bufferAppend|incompatible/i.test(data.details || "")) {
        const why = (data.error && data.error.message) || data.details, was = pv.mode;
        pvStop(true);
        pvShow("error", was === "original"
          ? "This browser cannot decode the original (" + why + "). HEVC plays in Chrome/Edge on Windows with the HEVC extension and in Safari; the preview (H.264) plays everywhere."
          : "This browser cannot decode H.264/AAC (" + why + ").");

/* ---------- incidents (the watchdog) ---------- */
let incAll = null, incAt = 0, wdInfo = null, wdAt = 0;
const fmtDur = s => s < 60 ? `${s} s` : s < 3600 ? `${Math.floor(s / 60)} min ${s % 60 ? (s % 60) + " s" : ""}`.trim() : s < 86400 ? `${Math.floor(s / 3600)} h ${Math.round((s % 3600) / 60)} min` : `${Math.floor(s / 86400)} d ${Math.round((s % 86400) / 3600)} h`;

/* rows: the source's incidents with their channels' under them; the rest on their own */
function incTable(list, withChan) {

      <td><span class="lamp ${x.closed ? "off" : x.level === "error" ? "bad" : "warn"}"></span></td><td class="mono">${fmtWhen(x.opened)}</td>
      <td>${x.closed ? fmtDur(dur) : `<b>${fmtDur(dur)}, still on</b>`}</td><td>${child ? "↳ " : ""}${who}</td><td>${esc(x.summary)}${x.diagnosis ? ` <span class="dim">· the technician: ${esc((CATEGORY[x.diagnosis.category] || x.diagnosis.category))}</span>` : ""}${x.verdict ? ` <span class="tag">${esc(x.verdict)}</span>` : ""}</td></tr>`;
  };
  return `<table class="evt inctab"><tbody>${top.map(x => row(x, false) + list.filter(y => y.parent === x.id).map(y => row(y, true)).join("")).join("")}</tbody></table>`;
}

    ${incAll.length ? `<div class="evwrap" style="border:0;border-radius:0;max-height:${full ? "none" : "340px"}">${incTable(incAll, true)}</div>` : `<div class="body"><div class="empty" style="padding:8px">No incidents in the last 24 hours.</div></div>`}</section>`;

async function openIncident(id) {

  const inp = then.input || {}, svc = then.service || {}, clk = then.clock || {}, ct = then.content || {};
  const dur = Math.round((x.closed || now) - x.opened);

    ["Where", x.channel ? esc(x.channel) : "the source, on several channels"], ["Source", `<span class="mono">${esc(x.group || "—")}</span>`], ["Rule", esc(x.rule)]];

    ["Picture", ct.picture ? `brightness ${Math.round(ct.picture.luma)}, change ${ct.picture.change}${ct.picture.black_ms ? `, black ${Math.round(ct.picture.black_ms / 1000)} s` : ""}${ct.picture.frozen_ms ? `, frozen ${Math.round(ct.picture.frozen_ms / 1000)} s` : ""}` : "—"],
    ["Sound", (ct.audio || []).map(a => `PID ${a.pid}: ${a.level_db.toFixed(0)} dBFS${a.silent_ms ? ` <span class="bad">silent ${Math.round(a.silent_ms / 1000)} s</span>` : ""}`).join(" · ") || "—"]] : [];

async function loadWatchdog(force) {

const WD_FIELDS_SYNC = [["av_shift_ms", "Audio timing moved by (ms) …"], ["av_shift_s", "… for (s): an incident"]];
const WD_FIELDS_DISK = [["disk_warn_pct", "Disk space low under (% free)"], ["disk_crit_pct", "Disk nearly full under (% free)"], ["disk_full_h", "Disk filling: full within (hours)"]];
const WD_FIELDS = [["min_s", "A problem lasting this long is an incident (s)"], ["content_s", "… a black or frozen picture, silent audio: this long (s)"], ["clear_s", "It is over when gone for (s)"],
  ["group_s", "Channels of one source starting within this of each other: one source incident (s)"], ["no_input_s", "No input after (s)"],
  ["cc_per_min", "CC errors per minute"], ["dropped_per_min", "Dropped or late pictures per minute"], ["restarts", "Restarts on its own …"],
  ["restart_window_s", "… within (s)"], ["cpu_pct", "CPU above (%)"], ["gpu_pct", "Video engine above (%)"], ["load_s", "… for (s)"]];
const fmtBytes = b => b == null || b < 0 ? "—" : b >= 1e12 ? (b / 1e12).toFixed(2) + " TB" : b >= 1e9 ? (b / 1e9).toFixed(1) + " GB" : b >= 1e6 ? (b / 1e6).toFixed(0) + " MB" : b >= 1e3 ? (b / 1e3).toFixed(0) + " kB" : b + " B";

  const rows = ds.map(d => {

    const fill = d.growth_per_h > 0 ? `${fmtBytes(d.growth_per_h)} an hour · full in about ${fmtDur(Math.round(3600 * d.avail / d.growth_per_h))}` : d.growth_per_h < 0 ? `${fmtBytes(-d.growth_per_h)} an hour freed` : "steady";
    const ours = d.ours.map(o => `<div class="sub">${esc(o.what)}: <span class="mono">${esc(o.path)}</span>${o.bytes >= 0 ? ` · ${fmtBytes(o.bytes)}` : ""}${o.what === "history" && sys.history && sys.history.cap_bytes ? ` of ${fmtBytes(sys.history.cap_bytes)} allowed` : ""}</div>`).join("");

/* ---------- evidence (what the tools found or kept) ---------- */
function evidenceList(list) {
  if (!list || !list.length) return `<div class="empty" style="padding:6px">Nothing gathered yet.</div>`;
  const one = e => {
    const r = e.result || {}, a = e.args || {}, file = e.file_bytes > 0 ? `/api/evidence/${e.id}/file` : null;
    let what = "", body = "";
    if (e.tool === "picture") { what = "Picture"; body = file ? `<a href="${file}" target="_blank"><img class="evpic" src="${file}" alt="picture"></a>` : `<span class="dim">the file is gone</span>`; }
    else if (e.tool === "record" || e.tool === "probe") {
      what = e.tool === "record" ? `${a.seconds || ""} s of the ${a.from === "output" ? "output" : "source"}` : `Probe of the source (${a.seconds || 3} s)`;
      if (a.kept && r.ok) {
        /* what the channel kept of its input: it begins before the moment it was asked for */
        const span = (r.to_s || 0) - (r.from_s || 0);
        what = `${span.toFixed(0)} s of the source`;
        body = `from ${(-(r.from_s || 0)).toFixed(0)} s before ${e.incident ? "the incident opened" : "it was asked for"} to ${(r.to_s || 0).toFixed(0)} s after · ${(r.packets || 0).toLocaleString()} packets` +
          (-(r.from_s || 0) < (a.before_s || 0) - 2 ? ` <span class="dim">(the channel had only ${(-(r.from_s || 0)).toFixed(0)} s)</span>` : "");
      } else if (a.from === "output") body = r.ok ? "" : `<span class="bad">nothing was written</span>`;
      else if (r.ok === false) body = `<span class="bad">${esc(r.error || "no answer")}</span>`;
      else if (r.programs) {
        const progs = r.programs.filter(p => !a.program || p.number === a.program);
        body = `${fmtRate(r.bitrate)} arriving · ${r.packets.toLocaleString()} packets${r.sync_errors ? ` · <span class="bad">${r.sync_errors} sync errors</span>` : ""} · ` +
          progs.slice(0, 3).map(p => `${esc(p.name || "service " + p.number)}: ${(p.streams || []).map(s => `${esc(s.kind)} ${s.pid}${s.bitrate != null ? " " + fmtRate(s.bitrate) : ""}`).join(", ")}`).join("; ") + (progs.length > 3 ? ` (+${progs.length - 3} more services)` : "");
      }
      if (file) body += ` <a href="${file}">download (${fmtBytes(e.file_bytes)})</a>`;
      else if (e.tool === "record") body += ` <span class="dim">no file (or it is gone)</span>`;
    } else if (e.tool === "peer_check") {
      what = `Asked ${esc(a.peer || "a peer")}`;
      body = r.ok ? `<span class="${r.seen ? "ok" : "bad"}">${esc(r.say || (r.seen ? "sees it" : "does not see it"))}</span>` : `<span class="bad">${esc(r.error || "no answer")}</span>`;
    } else if (e.tool === "ping") {
      what = `Ping ${esc(a.host || "")}`;
      body = r.error ? `<span class="bad">${esc(r.error)}</span>` : r.loss_pct < 0 ? `<span class="bad">no answer</span>` : `${r.loss_pct}% lost · ${r.rtt_avg_ms >= 0 ? r.rtt_avg_ms.toFixed(1) + " ms average" : "—"}`;
    } else { what = esc(e.tool); body = esc(JSON.stringify(r)).slice(0, 200); }
    return `<tr><td class="mono">${fmtWhen(e.t)}</td>${e.channel ? `<td>${esc(e.channel)}</td>` : "<td></td>"}<td>${what}</td><td>${body}</td></tr>`;
  };
  return `<table class="evt evtab"><tbody>${list.map(one).join("")}</tbody></table>`;
}
async function runTool(tool, body, after) {
  try {
    if (tool === "ping" && !body.host) { const h = prompt("Ping which host or address?", "192.168.110."); if (!h) return; body.host = h.trim(); }
    await api(`/api/tools/${tool}`, { method: "POST", body: JSON.stringify(body) });
    const wait = tool === "record" ? (body.seconds || 20) * 1000 + 4000 : tool === "probe" ? 7000 : tool === "ask_peers" ? 9000 : tool === "ping" ? 6000 : 800;
    toolNote(`${tool === "record" ? "Recording" : tool === "probe" ? "Probing" : tool === "ping" ? "Pinging" : "Keeping the picture"}… it shows here when done${wait > 2000 ? ` (about ${Math.round(wait / 1000)} s)` : ""}.`);
    setTimeout(() => { toolNote(""); after && after(); }, wait);
  } catch(e) { alert(e.message); }
}
function toolNote(t) { document.querySelectorAll(".toolnote").forEach(n => n.textContent = t); }

  return `<span class="tools">${chan ? b("record", "Record 20 s", { seconds: 20 }) + b("snapshot", "Keep the picture") + b("probe", "Probe the source", { seconds: 3 }) + b("ask_peers", "Ask the other transcoders", { seconds: 3 }) : ""}${b("ping", "Ping…")}<span class="toolnote dim"></span></span>`;

/* ---------- the technician ---------- */
const CATEGORY = { source_provider: "the provider's feed", source_ird: "an IRD", satellite_signal: "the satellite signal", network: "the network",
  transcoder: "this transcoder", normal_content: "nothing wrong (normal content)", unknown: "not known" };
function techView(x) {
  const d = x.diagnosis;
  if (!d) return `<div class="empty" style="padding:6px">${techInfo && techInfo.enabled ? "Not looked at yet (it looks once the evidence is in, about a minute after an incident opens)." : "The technician is not set up on this server."}</div>`;
  const c = Number(d.confidence), pct = isFinite(c) ? Math.round(Math.min(100, Math.max(0, c <= 1 ? c * 100 : c))) : 0;
  return `<div class="tech"><div class="cause">${esc(d.cause)}</div>
    <div class="dim">${esc(CATEGORY[d.category] || d.category)} · ${pct}% sure${x.diag_t ? ` · ${fmtWhen(x.diag_t)}` : ""}</div>
    <p>${esc(d.explanation)}</p>
    ${(d.next_checks || []).length ? `<div class="dim">Next:</div><ul>${d.next_checks.map(c => `<li>${esc(c)}</li>`).join("")}</ul>` : ""}
    ${d.ticket ? `<div class="dim">For the provider:</div><pre class="ticket">${esc(d.ticket)}</pre>` : ""}</div>`;
}
/* A person's word on the technician's answer: what makes it better */
function verdictView(x) {
  if (!x.diagnosis || x.parent) return "";
  const V = { right: "Right", partly: "Partly right", wrong: "Wrong" };
  if (x.verdict) {
    const a = x.actual || {};
    return `<div class="verdict"><b>Your verdict: ${V[x.verdict] || esc(x.verdict)}</b>${a.cause ? ` · it was: ${esc(a.cause)}` : ""}${a.category ? ` <span class="dim">(${esc(CATEGORY[a.category] || a.category)})</span>` : ""}${x.note ? ` · ${esc(x.note)}` : ""}
      <a style="margin-left:8px" onclick="verdictForm(${x.id}, '${esc(x.verdict)}')">change</a><div id="vform"></div></div>`;
  }
  return `<div class="verdict"><span class="dim">Was the technician right?</span>
    <button type="button" onclick="sendVerdict(${x.id}, 'right')">Right</button> <button type="button" onclick="verdictForm(${x.id}, 'partly')">Partly</button> <button type="button" onclick="verdictForm(${x.id}, 'wrong')">Wrong…</button>
    <div id="vform"></div></div>`;
}
function verdictForm(id, v) {
  const el = $("#vform");
  el.innerHTML = `<div class="f" style="margin-top:10px"><label>Verdict</label><select id="v_v"><option value="right">Right</option><option value="partly">Partly right</option><option value="wrong">Wrong</option></select>
    <label>It was actually</label><input id="v_cause" placeholder="in a sentence: what really caused it (leave empty if it was right)">
    <label>Which is</label><select id="v_cat"><option value="">—</option>${Object.entries(CATEGORY).map(([k, t]) => `<option value="${k}">${esc(t)}</option>`).join("")}</select>
    <label>Note</label><input id="v_note" placeholder="what told you, what fixed it (optional)"></div>
    <div style="margin-top:8px"><button type="button" class="primary" onclick="sendVerdict(${id})">Save</button></div>`;
  $("#v_v").value = v;
}
async function sendVerdict(id, v) {
  const body = v ? { verdict: v } : { verdict: $("#v_v").value, cause: $("#v_cause").value.trim(), category: $("#v_cat").value, note: $("#v_note").value.trim() };
  try { await api(`/api/incidents/${id}/verdict`, { method: "POST", body: JSON.stringify(body) }); setTimeout(() => { openIncident(id); incAt = 0; }, 2500); toolNote("Kept: it is used the next time something like this happens."); }
  catch(e) { alert(e.message); }
}
let techInfo = null, techAt = 0;
async function loadTech(force) {
  if (!force && Date.now() - techAt < 10000) return;
  techAt = Date.now();
  try { techInfo = await api("/api/technician"); } catch(e) { techInfo = { error: e.message }; }
  rerender();
}
async function askTechnician(id) {
  try { await api("/api/technician/diagnose", { method: "POST", body: JSON.stringify({ incident: id }) }); toolNote("Asked: the answer shows here when it is ready (a few seconds on a card, a minute or two on the CPU)."); setTimeout(() => openIncident(id), 20000); }
  catch(e) { alert(e.message); }
}
function techCard(where) {
  if (!techInfo) { loadTech(); return ""; }
  if (techInfo.error) return "";
  const T = techInfo, states = { off: "resting (started when there is something to look at)", idle: "ready", starting: "loading the model", thinking: "looking at an incident", unavailable: "cannot run", disabled: "turned off" };
  const missing = T.setting_up ? "being set up now: the model server is built and the model downloaded (see /var/log/caricoder3-technician-setup.log)"
    : !T.server_present ? "the model server is not installed" : !T.model_present ? "the model file is not there" : "";
  const whereTxt = w => w === "cpu" ? "the CPU (lowest priority)" : w === "all" ? "both cards (split)" : "card " + esc(w.slice(3));
  const wantTxt = g => g === "auto" ? "a card with room, else both cards, else the CPU" : g === "cpu" ? "the CPU" : g === "all" ? "both cards" : "card " + esc(g);
  return `<section class="card"><header><h2>Technician</h2><span class="hint">A language model on this server, offline: it says what it thinks caused each incident</span><div class="sp"></div>${where === "settings" ? `<button onclick="editTech()">Change</button>` : `<a onclick="go('settings')">model and where it runs</a>`}</header><div class="body"><div class="stat">
    <div class="box"><h4>State</h4><div class="big" style="font-size:18px">${esc(states[T.state] || T.state)}</div><div class="sub" title="${esc(T.where_why || "")}">${T.where ? `on ${whereTxt(T.where)}` : `will run on ${wantTxt(T.gpu)}`}${T.idle_s === 0 ? " · kept loaded" : ""}${T.queue ? ` · ${T.queue} waiting` : ""}</div></div>
    ${where === "settings" || missing ? `<div class="box"><h4>Model</h4><div class="sub mono" style="word-break:break-all">${esc(T.model)}</div>${missing ? `<div class="sub ${T.setting_up ? "warn" : "bad"}">${missing}${T.setting_up ? "" : " (the installer sets it up)"}</div>` : ""}</div>` : ""}
    ${where === "settings" ? "" : `<div class="box"><h4>So far</h4><div class="big">${T.done}</div><div class="sub">incidents looked at since the supervisor started${T.failed ? ` · <span class="warn">${T.failed} could not be</span>` : ""}${T.last_t ? ` · last ${fmtWhen(T.last_t)}${T.last_seconds ? ` in ${fmtDur(T.last_seconds)}` : ""}` : ""}</div>${T.last_error ? `<div class="sub bad">${esc(T.last_error)}</div>` : ""}</div>`}
    ${T.verdicts && where !== "settings" ? `<div class="box"><h4>Your verdicts</h4><div class="big">${T.verdicts.right + T.verdicts.partly + T.verdicts.wrong}</div><div class="sub">${T.verdicts.right} right · ${T.verdicts.partly} partly · ${T.verdicts.wrong} wrong${T.verdicts.waiting_looked_at ? ` · <span class="warn">${T.verdicts.waiting_looked_at} answer${T.verdicts.waiting_looked_at > 1 ? "s" : ""} waiting for yours</span>` : ""}</div>
      <div class="sub"><a href="/api/training/export">Download them as training data</a> (JSON lines)</div></div>` : ""}
  </div>
  ${where === "settings" ? "" : `<div class="sub" style="margin-top:10px">Reviewing many at once: <a href="/api/incidents?limit=2000&download=1">download the last week's incidents</a> (JSON, with the technician's answers) ·
    <a href="#" onclick="$('#vimport').click(); return false">import verdicts…</a> (JSON lines: <span class="mono">{"id", "verdict", "category", "cause", "note"}</span>)
    <input type="file" id="vimport" accept=".jsonl,.json,.txt" style="display:none" onchange="importVerdicts(this)"> <span id="vimport_note">${importNote}</span></div>`}
  </div></section>`;
}
function editTech() {
  const d = $("#dlg"), T = techInfo || {}, ms = T.models || [];
  const gb = mb => (mb / 1024).toFixed(1) + " GB";
  d.innerHTML = `<h3>Technician</h3><div class="f">
    <label>Model</label><select id="t_model">${ms.map(m => `<option value="${esc(m.path)}" ${m.path === T.model_path ? "selected" : ""}>${esc(m.name)} (${gb(m.mb)}, needs about ${gb(m.need_mb)} on a card)</option>`).join("")}</select>
    <label>Where it runs</label><select id="t_gpu">${[["auto", "A card with room, else both cards, else the CPU"], ["0", "Card 0"], ["1", "Card 1"], ["all", "Both cards, split"], ["cpu", "The CPU (slow, lowest priority)"]]
      .map(([v, t]) => `<option value="${v}" ${v === T.gpu ? "selected" : ""}>${t}</option>`).join("")}</select>
    <label><input type="checkbox" id="t_keep" ${T.idle_s === 0 ? "checked" : ""}> Keep it loaded (answers at once; otherwise it is unloaded after 10 idle minutes and loading a big model can take minutes)</label></div>
    <div class="help">Models are the .gguf files in /var/lib/caricoder3/models and its eval folder (scripts/tech-eval-models.sh fetches more; caricoder3 tech-eval compares them). Changing it takes effect from the next answer.</div>
    <div id="t_msg" style="margin-top:10px"></div><div class="actions"><button onclick="document.getElementById('dlg').close()">Cancel</button><button class="primary" id="t_go">Save</button></div>`;
  $("#t_go").onclick = async () => {
    try { techInfo = await api("/api/technician", { method: "PUT", body: JSON.stringify({ model: $("#t_model").value, gpu: $("#t_gpu").value, keep_loaded: $("#t_keep").checked }) }); d.close(); rerender(); }
    catch(e) { $("#t_msg").innerHTML = `<div class="msg err">${esc(e.message)}</div>`; }

}
let importNote = "";
async function importVerdicts(inp) {
  const f = inp.files && inp.files[0]; if (!f) return;
  try {
    const j = await api("/api/verdicts/import", { method: "POST", body: await f.text() });
    importNote = `<span class="${j.failed ? "warn" : "ok"}">${j.applied} verdict${j.applied === 1 ? "" : "s"} imported${j.failed ? `, ${j.failed} could not be: ${esc(j.errors)}` : ""}</span>`;
  } catch(e) { importNote = `<span class="bad">${esc(e.message)}</span>`; }
  inp.value = "";
  loadTech(true);
}

/* ---------- asking the technician (the chat) ---------- */
let chatOpen = false, chatMsgs = [], chatWait = null;
async function chatLoad() {
  try { const j = await api("/api/peers"); chatMsgs = (j.messages || []).filter(m => (m.peer === "technician" || m.peer === "person") && !m.incident).reverse(); } catch(e) {}
  chatRender();
}
function chatRender() {
  const el = $("#chatlog"); if (!el) return;
  el.innerHTML = chatMsgs.length ? chatMsgs.map(m => `<div class="cm ${m.peer === "person" ? "me" : "it"}"><div class="who">${m.peer === "person" ? "You" : "Technician"} · ${fmtWhen(m.t)}</div><div class="txt">${esc(m.text)}</div></div>`).join("")
    : `<div class="dim" style="padding:10px">Ask anything about this transcoder in plain words: "what is wrong right now?", "why did bet go black this morning?", "which channels come from 224.100.1.5?"</div>`;
  if (chatWait) el.innerHTML += `<div class="cm it"><div class="who">Technician</div><div class="txt dim">${esc(chatWait.note || "thinking…")}</div></div>`;
  el.scrollTop = el.scrollHeight;
}
function chatToggle() {
  chatOpen = !chatOpen;
  $("#chat").classList.toggle("on", chatOpen);
  if (chatOpen) { chatLoad(); setTimeout(() => $("#chatq").focus(), 50); }
}
async function chatSend() {
  const q = $("#chatq").value.trim();
  if (!q || chatWait) return;
  $("#chatq").value = "";
  chatMsgs.push({ peer: "person", t: Date.now() / 1000, text: q });
  try {
    const r = await api("/api/technician/ask", { method: "POST", body: JSON.stringify({ question: q }) });
    chatWait = { id: r.id, since: Date.now(), errs: 0 };
  } catch(e) { chatMsgs.push({ peer: "technician", t: Date.now() / 1000, text: "(" + e.message + ")" }); }
  chatRender();
  const poll = async () => {
    if (!chatWait) return;
    try {
      const a = await api(`/api/technician/ask?id=${chatWait.id}`);
      if (a.state === "answered" || a.state === "failed") {
        /* shown at once: the record has it a couple of seconds later */
        chatWait = null;
        chatMsgs.push({ peer: "technician", t: Date.now() / 1000, text: a.state === "failed" ? "(" + (a.answer || "no answer") + ")" : a.answer });
        chatRender();
        setTimeout(chatLoad, 4000);
        return;
      }
      const secs = Math.round((Date.now() - chatWait.since) / 1000);
      chatWait.errs = 0;
      chatWait.note = (a.model_state === "starting" ? "loading the model first…" : a.state === "waiting" ? "waiting its turn (it finishes the incident it is on first)…" : "thinking…")
        + ` ${fmtDur(secs)}` + (secs > 60 && a.where === "cpu" ? " · on the CPU an answer can take several minutes; it stays here when it comes" : "");
      chatRender();
    } catch(e) {
      /* a hiccup is not the end of the question: give up only after a few in a row */
      if (++chatWait.errs >= 5) { chatMsgs.push({ peer: "technician", t: Date.now() / 1000, text: "(lost track of the answer: " + e.message + "; it will show here when the chat is opened again)" }); chatWait = null; chatRender(); return; }
    }
    setTimeout(poll, 3000);
  };
  setTimeout(poll, 1500);
}

/* ---------- the server ---------- */
const fmtKB = kb => kb >= 1048576 ? (kb / 1048576).toFixed(1) + " GB" : Math.round(kb / 1024) + " MB";
const barCls = p => p >= 90 ? "bad" : p >= 75 ? "warn" : "";
function renderServer() {
  if (!sys) { $("#main").innerHTML = `<div class="head"><h1>Server</h1></div><div class="msg err">Cannot reach the supervisor.</div>`; return; }
  const st = sys.system || {}, cpu = st.cpu || {}, mem = st.memory || {};
  const memUsed = (mem.total_kb || 0) - (mem.available_kb || 0), memPct = mem.total_kb ? 100 * memUsed / mem.total_kb : 0;
  const swapUsed = (mem.swap_total_kb || 0) - (mem.swap_free_kb || 0);
  const gpus = st.gpus || [], ifs = st.interfaces || [];
  const running = channels.filter(c => c.state === "running");
  const inSum = running.reduce((a, c) => a + (((c.stats||{}).input||{}).bitrate || 0), 0), outSum = running.reduce((a, c) => a + (((c.stats||{}).output||{}).bitrate || 0), 0);
  const main = $("#main"); if (main.dataset.page !== "server") { main.dataset.page = "server"; }
  main.innerHTML = `<div class="head"><h1>Server</h1><span class="state">${esc(sys.host)} · caricoder3 ${esc(sys.version)} · up ${fmtUp(sys.uptime)}</span><div class="sp"></div></div>
    <section class="card"><header><h2>Load</h2><span class="hint">Sampled every 2 seconds</span></header><div class="body"><div class="stat">
      <div class="box"><h4>CPU</h4><div class="big">${(cpu.percent||0).toFixed(0)}%</div><div class="sub">${cpu.cores||"?"} cores · load ${(cpu.load1||0).toFixed(2)} / ${(cpu.load5||0).toFixed(2)} / ${(cpu.load15||0).toFixed(2)}</div><div class="bar"><i class="${barCls(cpu.percent||0)}" style="width:${Math.min(100, cpu.percent||0)}%"></i></div></div>
      <div class="box"><h4>Memory</h4><div class="big">${fmtKB(memUsed)}</div><div class="sub">of ${fmtKB(mem.total_kb||0)} used (${memPct.toFixed(0)}%)${mem.swap_total_kb ? ` · swap ${fmtKB(swapUsed)} of ${fmtKB(mem.swap_total_kb)}` : ""}</div><div class="bar"><i class="${barCls(memPct)}" style="width:${memPct.toFixed(0)}%"></i></div></div>
      <div class="box"><h4>Channels</h4><div class="big">${running.length} <span style="font-size:14px;font-weight:400;color:var(--dim)">of ${channels.length} running</span></div><div class="sub">${fmtRate(inSum)} in · ${fmtRate(outSum)} out</div></div>
      ${gpus.map(g => `<div class="box"><h4>GPU ${g.index} · ${esc(g.name)}</h4><div class="big">${g.util >= 0 ? g.util + "%" : "—"}</div><div class="sub">encoder ${g.encoder >= 0 ? g.encoder + "%" : "—"} · decoder ${g.decoder >= 0 ? g.decoder + "%" : "—"}${g.mem_total > 0 ? ` · memory ${g.mem_used} of ${g.mem_total} MB` : ""}${g.temp >= 0 ? ` · ${g.temp} °C` : ""}${g.power >= 0 ? ` · ${g.power} W` : ""}</div><div class="bar"><i class="${barCls(Math.max(g.util||0, g.encoder||0, g.decoder||0))}" style="width:${Math.max(0, g.util||0)}%"></i></div></div>`).join("")}
      ${!gpus.length ? `<div class="box"><h4>GPU</h4><div class="big" style="font-size:16px;font-weight:400;color:var(--dim)">${st.nvidia_smi ? esc(st.gpu_error || "no card reported") : "no nvidia-smi on this machine"}</div></div>` : ""}
    </div></div></section>
    ${(sys.card_processes || []).length ? `<section class="card"><header><h2>Card processes</h2><span class="hint">One per video card: the channels' video is transcoded there, sharing one workspace on the card</span></header>
      <table><thead><tr><th>Card</th><th>Process</th><th>Video sessions</th><th>Channels</th></tr></thead><tbody>
      ${sys.card_processes.map(x => { const ss = (x.process || {}).sessions || []; const chs = [...new Set(ss.map(y => y.channel))];
        return `<tr><td>${x.card}${sys.card_mode === "test" ? ' <span style="color:var(--dim)">(test, CPU)</span>' : ""}</td><td>${x.running ? `running · up ${fmtUp(x.up_s)}` : "<span class='bad'>not running</span>"}${x.restarts ? ` · <span class="warn">${x.restarts} restart${x.restarts > 1 ? "s" : ""}</span>` : ""}</td><td>${ss.length}</td><td>${chs.map(esc).join(", ") || '<span style="color:var(--dim)">none</span>'}</td></tr>`; }).join("")}
      </tbody></table></section>` : ""}
    ${sys.history ? `<section class="card"><header><h2>History</h2><span class="hint">CPU and video engines${sys.history.bytes != null ? ` · record ${fmtKB(sys.history.bytes / 1024)} of ${fmtKB(sys.history.cap_bytes / 1024)} allowed` : ""}</span><div class="sp"></div><span id="histrange"></span></header><div class="body" id="srvhist"></div></section>` : ""}
    ${disksCard()}
    <section class="card"><header><h2>Network interfaces</h2><span class="hint">Rates since the previous sample; errors and drops since boot</span></header>
      <div class="tw"><table><thead><tr><th>Interface</th><th>State</th><th>Receive</th><th>Transmit</th><th>Packets in / out</th><th>Errors in / out</th><th>Dropped in / out</th></tr></thead><tbody>
      ${ifs.map(i => `<tr><td class="mono">${esc(i.name)}</td><td>${i.up ? "up" : "<span class='bad'>down</span>"}${i.speed_mbps > 0 ? ` · ${i.speed_mbps >= 1000 ? (i.speed_mbps / 1000) + " Gb/s" : i.speed_mbps + " Mb/s"}` : ""}</td><td>${fmtRate(i.rx_bps)}</td><td>${fmtRate(i.tx_bps)}</td><td>${i.rx_packets.toLocaleString()} / ${i.tx_packets.toLocaleString()}</td><td>${i.rx_errors || i.tx_errors ? `<span class="warn">${i.rx_errors} / ${i.tx_errors}</span>` : "0 / 0"}</td><td>${i.rx_dropped || i.tx_dropped ? `<span class="warn">${i.rx_dropped} / ${i.tx_dropped}</span>` : "0 / 0"}</td></tr>`).join("") || `<tr><td colspan="7" class="empty">No interfaces reported.</td></tr>`}
      </tbody></table></div></section>
    <section class="card"><header><h2>Shared inputs</h2><span class="hint">An input several channels take programs from is read once, by one reader, and each channel gets only its program</span></header>
      <table><thead><tr><th>Input</th><th>Reader</th><th>Rate</th><th>Channels</th><th>Socket overflows</th></tr></thead><tbody>
      ${(sys.shares || []).map(x => { const r = x.reader || {}; const missing = (r.outputs || []).filter(o => !o.pmt_seen).length;
        return `<tr><td class="mono">${esc(x.url)}</td><td>${x.running ? "running" : "<span class='bad'>not running</span>"}${x.restarts ? ` · ${x.restarts} restart${x.restarts > 1 ? "s" : ""}` : ""}</td><td>${fmtRate(r.bitrate)}</td><td>${x.channels}${missing ? ` <span class="warn">(${missing} program${missing > 1 ? "s" : ""} not found in it)</span>` : ""}</td><td>${r.socket_overflow ? `<span class="warn">${r.socket_overflow}</span>` : "0"}</td></tr>`; }).join("") || `<tr><td colspan="5" class="empty">No channel reads a UDP or RTP input right now.</td></tr>`}
      </tbody></table></section>
`;
  if (sys.history) { renderServerHistory(); loadServerHistory(); loadWatchdog(); }
}

/* ---------- a channel ---------- */
let current = null;   // the channel object as last fetched
async function renderChan(name) {
  let data; try { data = await api("/api/channels/" + encodeURIComponent(name)); } catch(e) { const p = $("#chanpane"); if (p) p.innerHTML = `<div class="msg err">${esc(e.message)}</div>`; return; }
  const c = current = data.channel, running = c.state === "running";
  const inRail = channels.find(x => x.name === c.name);
  if (inRail && inRail._health) c._health = inRail._health;
  const formHtml = $("#settings") ? null : settingsHtml();   // keep the form while editing
  const pane = $("#chanpane"); if (!pane) return;
  if (!pane.querySelector(".head") || pane.dataset.chan !== name) {
    pane.dataset.chan = name;
    thumbStamp = Date.now();
    pane.innerHTML = `
      <div class="head"><h1><span class="lamp" id="hlamp"></span>${esc(c.name)}</h1><span class="state" id="hstate"></span><div class="sp"></div>
        <span id="hbtns"></span></div>
      <div id="msg"></div>
      <div class="path" id="path">
        <div class="node" id="n_src"><h3>Source</h3>
          <div class="pvbox"><img id="pv_poster" src="${thumbUrl(c.name)}" alt="" onerror="this.style.visibility='hidden'" onload="this.style.visibility=''"><video id="pv" playsinline controls style="display:none"></video>
            <button id="pv_over" class="pvplay" onclick="pvPlay('preview')" title="Play the preview" aria-label="Play the preview"></button><div id="pv_msg" class="pvmsg" style="display:none"></div></div>
          <div class="pvctl" id="pvctl"></div><div id="src_info"></div></div>
        <div class="arrow">›</div><div class="node" id="n_proc"></div><div class="arrow">›</div><div class="node" id="n_out"></div></div>
      <section class="card" id="histcard"><header><h2>History</h2><span class="hint">Kept on this server: detail 3 days, minutes 30 days, hours a year</span><div class="sp"></div><span id="histrange"></span></header><div class="body" id="histbody"></div></section>
      <section class="card" id="streamscard"><header><h2>Streams</h2><span class="hint">What comes in and what goes out, with each stream's rate</span></header><div class="body"><div class="streams"><div id="mediainfo"></div><div id="bwgraph"></div></div></div></section>
      <section class="card" id="outputs"></section>

    proc: `<h3>Processing</h3><div class="sub" style="font-size:14px;color:var(--fg)">${proc}</div>
      <div class="sub">${xs.length ? `${xs.reduce((a,s)=>a+(s.frames_out||0),0)} frames out · ${slack!=null&&slack<1e9?`${(slack/1000).toFixed(1)} s to spare`:""}${xs.some(s=>s.failed)?` · <span class="flag bad">a transcoder failed</span>`:""}${xs.reduce((a,s)=>a+(s.input_dropped||0),0)?` · <span class="flag">${xs.reduce((a,s)=>a+(s.input_dropped||0),0)} frames dropped</span>`:""}` : (svc.streams||[]).length ? `${(svc.streams||[]).length} streams, program ${svc.number??""}` : ""}</div>`,

/* An output's URL back into the form: its type, the fields the form has,

function parseOut(url) {

  (query || "").split("&").filter(Boolean).forEach(p => { const k = p.split("=")[0]; q[k] = decodeURIComponent(p.slice(k.length + 1)); order.push(k); });

  if (sch === "udp" || sch === "rtp") { type = sch; f = { host, port, ttl: q.ttl || "8", iface: q.iface || "", loop: q.loop === "0" || q.loop === "false" ? "0" : "1" }; own = ["ttl", "iface", "loop"]; }
  else if (sch === "srt") { type = host && q.mode !== "listener" ? "srtc" : "srtl"; f = { host, port, latency: q.latency || "120", passphrase: q.passphrase || "", streamid: q.streamid || "" }; own = ["latency", "passphrase", "streamid"]; }
  else if (sch === "rist") { type = at ? "ristl" : "ristc"; f = { host, port, buffer: q.buffer || "1000", secret: q.secret || "" }; own = ["buffer", "secret", "aes-type"]; }

}
