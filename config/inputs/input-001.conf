# =============================================================================
# CariTranscoder Input Configuration
# =============================================================================

[input]
# Unique identifier
id = input-001
name = Main Feed SRT
description = Primary broadcast feed via SRT
enabled = true

# Input type: srt, udp, rtp, rist, rtmp, rtsp, hls, file, sdi
type = srt

[source]
# SRT specific settings
mode = listener
# Modes: listener (wait for connection), caller (connect to remote)

# For listener mode
listen_address = 0.0.0.0
listen_port = 4900

# For caller mode (uncomment if mode = caller)
#remote_address = 192.168.1.100
#remote_port = 4900

# SRT options
latency = 120
passphrase =
pbkeylen = 16
# Key length: 16, 24, or 32

# Stream ID (optional)
streamid =

# Timeout settings (milliseconds)
connect_timeout = 3000
read_timeout = 5000

# Encryption: none, aes-128, aes-256
encryption = none

[stream]
# Expected stream format (for validation)
container = mpegts
# Options: mpegts, rtp, raw

# Video codec hint (optional, for faster init)
video_codec = h264

# Audio codec hint (optional)
audio_codec = aac

[output]
# Output multicast address
address = 239.100.0.1
port = 10000
api_port = 9100

[failover]
# Failover settings
enabled = false

# Backup input ID
backup_input = input-002

# Switch conditions
max_signal_loss_ms = 1000
max_cc_errors_per_sec = 10

[monitoring]
# Enable detailed monitoring
enabled = true

# Alert thresholds
bitrate_min_warn = 1000000
bitrate_max_warn = 50000000
cc_error_threshold = 5
