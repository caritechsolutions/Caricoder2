# =============================================================================
# CariTranscoder Output Configuration
# =============================================================================

[output]
# Unique identifier
id = output-001
name = UDP Multicast Out
description = Main multicast output
enabled = true

# Output type: udp, srt, rist, rtmp, hls, dash, file, sdi
type = udp

[input]
# Input source
buffer_name = mux-001-out

# Or direct from service
source_service = mux-001

[destination]
# UDP specific settings
address = 239.1.1.1
port = 5000

# Network interface (optional, empty = default)
interface =

# TTL for multicast
ttl = 64

# TOS/DSCP for QoS
tos = 0

# Socket buffer size (bytes)
buffer_size = 2097152

[destination_srt]
# SRT specific settings (when type = srt)
mode = caller
# Modes: caller, listener, rendezvous

# For caller mode
#remote_address = 192.168.1.100
#remote_port = 4900

# For listener mode
#listen_address = 0.0.0.0
#listen_port = 4900

# SRT options
latency = 120
passphrase =
pbkeylen = 16

# Encryption: none, aes-128, aes-256
encryption = none

# Stream ID
streamid =

# Overhead bandwidth (percent)
overhead = 25

[destination_rist]
# RIST specific settings (when type = rist)
profile = main
# Profiles: simple, main, advanced

#url = rist://192.168.1.100:5000

# Buffer size (milliseconds)
buffer = 1000

# Bandwidth overhead (percent)
overhead = 5

[destination_rtmp]
# RTMP specific settings (when type = rtmp)
#url = rtmp://live.server.com/app/streamkey

# Reconnect attempts
reconnect_attempts = 3
reconnect_delay = 5

[destination_hls]
# HLS specific settings (when type = hls)
#output_dir = /var/www/hls/stream1

# Segment duration (seconds)
segment_duration = 6

# Playlist length (segments)
playlist_length = 5

# Segment naming: sequential, timestamp
naming = sequential

# Delete old segments
delete_old = true

[destination_file]
# File recording settings (when type = file)
#path = /recordings/stream1.ts

# Recording mode: continuous, segmented
mode = continuous

# Segment duration for segmented mode (seconds)
segment_duration = 3600

# Filename pattern for segments
# Variables: %Y, %m, %d, %H, %M, %S, %n (sequence number)
filename_pattern = recording_%Y%m%d_%H%M%S.ts

# Maximum file size (bytes, 0 = unlimited)
max_file_size = 0

# Auto-rotate based on size
auto_rotate = false

[redundancy]
# Output redundancy settings
enabled = false

# Redundant destinations (comma-separated)
# Format: type://address:port
#backup_destinations = udp://239.1.1.2:5000

# Mode: mirror (send to all), failover (switch on error)
mode = failover

# Failover trigger
failover_timeout_ms = 1000

[bitrate]
# Output bitrate control
mode = passthrough
# Modes: passthrough, limit, shape

# Maximum bitrate (bps) for limit/shape mode
max_bitrate = 0

# Smoothing buffer (milliseconds)
smoothing_buffer = 0

[monitoring]
enabled = true

# Alert thresholds
connection_timeout_ms = 5000
reconnect_delay_ms = 1000
max_reconnect_attempts = 10
