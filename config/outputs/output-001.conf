# =============================================================================
# CariTranscoder Output Configuration
# =============================================================================

[output]
# Unique identifier
id = output-001
name = SRT Output Example
description = SRT one-to-many output (listener mode)
enabled = true

# Output type: srt
type = srt

[input]
# UDP input source (from muxer, transcoder, or input)
# Address can be:
#   - Empty or 0.0.0.0: listen on all interfaces (unicast)
#   - Multicast address (224.x.x.x - 239.x.x.x): join multicast group
#   - Specific IP: listen on that interface only
address = 239.1.1.1
port = 5000

# Network interface for multicast (optional, empty = default)
interface =

[destination_srt]
# SRT output settings (one-to-many listener mode)
# Multiple clients can connect to this port simultaneously

# Listen address (0.0.0.0 = all interfaces)
listen_address = 0.0.0.0
listen_port = 4900

# Maximum simultaneous client connections
max_clients = 10

# SRT latency in milliseconds
# Higher = more reliable over poor networks, lower = less delay
latency = 120

# Encryption passphrase (leave empty for no encryption)
passphrase =

# Passphrase key length: 0 (none), 16 (AES-128), 24 (AES-192), 32 (AES-256)
pbkeylen = 0

# Stream ID (optional - for identifying stream on receiver)
streamid =

# Overhead bandwidth percent (for retransmissions)
overhead = 25

[monitoring]
enabled = true

# Alert thresholds
connection_timeout_ms = 5000
reconnect_delay_ms = 1000
max_reconnect_attempts = 10
