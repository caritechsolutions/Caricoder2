# =============================================================================
# CariTranscoder Output Configuration
# =============================================================================

[output]
# Unique identifier
id = output-001
name = SRT Output Example
description = SRT one-to-many output (listener mode)
enabled = true

# Output type: udp, srt, hls
type = srt

[input]
# Input source - ring buffer name from muxer or transcoder
buffer_name = mux-001-out

[destination]
# UDP specific settings (when type = udp)
address = 239.1.1.1
port = 5000

# Network interface (optional, empty = default)
interface =

# TTL for multicast
ttl = 64

# TOS/DSCP for QoS
tos = 0

# Socket buffer size (bytes)
buffer_size = 2097152

[destination_srt]
# SRT specific settings (when type = srt)
# Modes: listener (one-to-many), caller (one-to-one)
mode = listener

# For listener mode (one-to-many - recommended for distribution)
# Multiple clients can connect to this port simultaneously
listen_address = 0.0.0.0
listen_port = 4900

# Maximum simultaneous client connections
max_clients = 10

# SRT latency in milliseconds
# Higher = more reliable over poor networks, lower = less delay
latency = 120

# Encryption passphrase (leave empty for no encryption)
passphrase =

# Passphrase key length: 0 (none), 16 (AES-128), 24 (AES-192), 32 (AES-256)
pbkeylen = 0

# Stream ID (optional - for identifying stream on receiver)
streamid =

# Overhead bandwidth percent (for retransmissions)
overhead = 25

[destination_hls]
# HLS specific settings (when type = hls)
#output_dir = /var/www/hls/stream1

# Segment duration (seconds)
segment_duration = 6

# Playlist length (segments)
playlist_length = 5

# Segment naming: sequential, timestamp
naming = sequential

# Delete old segments
delete_old = true

[monitoring]
enabled = true

# Alert thresholds
connection_timeout_ms = 5000
reconnect_delay_ms = 1000
max_reconnect_attempts = 10
