# =============================================================================
# CariTranscoder Multiplexer Test Configuration
# For testing TSDuck MPTS muxing with PSI generation
# =============================================================================

[muxer]
id = mux-test
name = Test MPTS Muxer

[output]
# Output bitrate (bps) - total MPTS bitrate
output_bitrate = 20000000

# Output UDP address
address = 239.1.1.100
port = 5500

[network]
# DVB network settings
network_id = 1
network_name = CariTrans
ts_id = 1
original_network_id = 1

[tsduck]
# PSI table repetition intervals (milliseconds)
pat_interval = 100
pmt_interval = 100
sdt_interval = 500
nit_interval = 10000

[services]
# Service 1: BBCWLA
service.1.enabled = true
service.1.source_address = 239.0.0.1
service.1.source_port = 5000
service.1.program_number = 1001
service.1.service_name = BBCWLA
service.1.service_provider = CariTrans
service.1.service_type = 1
service.1.pmt_pid = 256
service.1.source_video_pid = 211
service.1.source_audio_pid = 221
service.1.video_pid = 100
service.1.audio_pid = 101

# Service 2: BET
service.2.enabled = true
service.2.source_address = 239.0.0.2
service.2.source_port = 5000
service.2.program_number = 1002
service.2.service_name = BET
service.2.service_provider = CariTrans
service.2.service_type = 1
service.2.pmt_pid = 512
service.2.source_video_pid = 211
service.2.source_audio_pid = 221
service.2.video_pid = 200
service.2.audio_pid = 201

# Service 3: PARAMOUNT
service.3.enabled = true
service.3.source_address = 239.0.0.3
service.3.source_port = 5000
service.3.program_number = 1003
service.3.service_name = PARAMOUNT
service.3.service_provider = CariTrans
service.3.service_type = 1
service.3.pmt_pid = 768
service.3.source_video_pid = 211
service.3.source_audio_pid = 221
