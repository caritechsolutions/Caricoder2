# =============================================================================
# CariTranscoder Multiplexer Configuration
# =============================================================================

[muxer]
# Unique identifier
id = mux-001
name = MPTS Muxer
description = Combine multiple SPTS into single MPTS
enabled = true

# Mux mode: mpts (combine), spts (extract), remux (passthrough with edits)
mode = mpts

[inputs]
# Input sources (comma-separated buffer names or service IDs)
sources = transcode-001-out,transcode-002-out

# Or define each input explicitly
#input.1.buffer = transcode-001-out
#input.1.program = 1
#input.2.buffer = transcode-002-out
#input.2.program = 2

[output]
# Output buffer
buffer_name = mux-001-out

# Target service(s)
targets = output-001

# Output bitrate (bps) - for CBR stuffing, 0 = VBR
output_bitrate = 0

[mpegts]
# MPEG-TS specific settings

# PMT PID assignment mode: auto, manual
pmt_mode = auto

# Starting PID for auto assignment
pmt_start_pid = 256

# PCR PID mode: video, dedicated, manual
pcr_mode = video

# PCR interval (milliseconds)
pcr_interval = 40

# PAT interval (milliseconds)
pat_interval = 100

# PMT interval (milliseconds)
pmt_interval = 100

[tsduck]
# TSDuck processing options
enabled = true

# PID remapping: original=new,original=new
# Example: 256=100,257=101
pid_remap =

# Bitrate regulation
regulate_bitrate = false
target_bitrate = 15000000

# PCR restamping
pcr_restamp = true

# Null packet stuffing for CBR
null_stuffing = false

# Service information editing
edit_si = false

[tsduck_si]
# Service Information editing (when edit_si = true)

# Network settings
network_id = 1
network_name = CariTrans Network

# Transport stream settings
ts_id = 1

# Original network ID
original_network_id = 1

[programs]
# Program/service definitions for MPTS

# Program 1
program.1.enabled = true
program.1.number = 1
program.1.name = Channel 1 HD
program.1.provider = CariTrans
program.1.source = transcode-001-out
program.1.pmt_pid = 256

# Program 2
program.2.enabled = true
program.2.number = 2
program.2.name = Channel 2 HD
program.2.provider = CariTrans
program.2.source = transcode-002-out
program.2.pmt_pid = 512

[pid_filtering]
# PID filter mode: none, whitelist, blacklist
mode = none

# Whitelist/blacklist PIDs (comma-separated)
pids =

[monitoring]
# Monitoring settings
enabled = true

# Alert on missing input
alert_missing_input = true
missing_input_timeout_ms = 1000
