# =============================================================================
# CariTranscoder Transcoder Configuration
# =============================================================================

[transcoder]
# Unique identifier
id = transcode-001
name = HD to HD HEVC
description = Transcode H.264 to H.265/HEVC
enabled = true

[input]
# Input source
buffer_name = input-001-out

# Or direct from input service
source_service = input-001

[video]
# Video processing mode: transcode, passthrough, drop
mode = transcode

# Decoder settings
decoder = auto
# Options: auto, software, nvdec, vaapi, qsv

# Encoder settings
codec = h265
# Options: h264, h265, mpeg2, vp9, av1

encoder = auto
# Options: auto, software, nvenc, vaapi, qsv
# auto will try hardware first, fallback to software

# Encoding preset
preset = medium
# Options: ultrafast, superfast, veryfast, faster, fast, medium, slow, slower, veryslow

# Profile
profile = main
# H.264: baseline, main, high
# H.265: main, main10, main-intra

# Level (auto or specific)
level = auto

# Rate control: cbr, vbr, crf
rate_control = cbr

# Bitrate (bps)
bitrate = 8000000
max_bitrate = 10000000
buffer_size = 16000000

# CRF value (only for rate_control = crf)
crf = 23

# Keyframe interval (frames, 0 = auto based on framerate)
keyframe_interval = 60

# B-frames
bframes = 2

# Reference frames
ref_frames = 3

[video_scaling]
# Scaling settings
enabled = false

# Output resolution
width = 1920
height = 1080

# Scaling algorithm: bilinear, bicubic, lanczos
algorithm = lanczos

# Framerate conversion
framerate_mode = preserve
# Options: preserve, convert
target_framerate = 30

# Deinterlace
deinterlace = auto
# Options: auto, off, on
deinterlace_mode = adaptive
# Options: adaptive, blend, bob, weave

[audio]
# Audio processing mode: transcode, passthrough, drop
mode = transcode

# Decoder
decoder = auto

# Encoder settings
codec = aac
# Options: aac, ac3, eac3, mp2, opus

# Bitrate (bps)
bitrate = 192000

# Sample rate
sample_rate = 48000

# Channels: preserve, stereo, 5.1, mono
channels = preserve

[audio_tracks]
# Multiple audio track handling
# Options: all, first, select
mode = all

# Selected tracks (if mode = select)
# Comma-separated PIDs or track numbers
#selected = 1,2

[subtitles]
# Subtitle handling
mode = passthrough
# Options: passthrough, drop, burn-in

[output]
# Output buffer
buffer_name = transcode-001-out

# Target service(s)
targets = mux-001

# Output container
container = mpegts

[performance]
# Threading
threads = 0
# 0 = auto (number of CPU cores)

# GPU device (for hardware encoding)
gpu_device = 0

# Priority: low, normal, high, realtime
priority = normal
