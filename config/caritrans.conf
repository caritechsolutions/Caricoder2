# =============================================================================
# CariTranscoder Main Configuration File
# =============================================================================

[system]
# System identification
hostname = node1
node_id = 1

# Paths
config_dir = /etc/caritrans
run_dir = /run/caritrans
log_dir = /var/log/caritrans
data_dir = /var/lib/caritrans

# Logging level: debug, info, warning, error
log_level = info

# License file path
license_file = /etc/caritrans/license.key

[web]
# Web interface settings
listen_address = 0.0.0.0
listen_port = 8080
ssl_enabled = false
ssl_cert = /etc/caritrans/ssl/cert.pem
ssl_key = /etc/caritrans/ssl/key.pem

# Session settings
session_timeout = 3600
max_sessions = 100

[database]
# User database for web authentication
users_file = /etc/caritrans/users.conf

[cluster]
# High Availability settings
enabled = false
mode = active-standby
# Modes: active-standby, active-active, n+1

# This node's role: primary, secondary, standby
role = primary

# Cluster communication
cluster_port = 9000
cluster_interface = eth0

# Peer nodes (comma-separated)
# Format: node_id:ip:port
peers =

# Heartbeat settings (milliseconds)
heartbeat_interval = 500
heartbeat_timeout = 2000

# Virtual IP for failover (optional)
virtual_ip =
virtual_ip_interface =

# Config sync method: rsync, shared-storage
sync_method = rsync

[buffers]
# Shared memory ring buffer settings
# Size in MB per buffer
default_buffer_size = 100

# Number of TS packets per buffer (188 bytes each)
# 100MB = ~557,000 packets = ~0.8 seconds at 100Mbps
packets_per_buffer = 557000

# Buffer overflow policy: drop-oldest, block-writer
overflow_policy = drop-oldest

# Watchdog timeout (milliseconds)
watchdog_timeout = 5000

[gstreamer]
# GStreamer settings
plugin_path = /usr/lib/gstreamer-1.0
debug_level = 1

[tsduck]
# TSDuck integration settings
enabled = true
plugin_path = /usr/bin

# Default bitrate regulation (bps), 0 = disabled
default_bitrate = 0

# PCR restamping
pcr_restamp = true

[internal_routing]
# Internal multicast address pool for connecting pipeline stages
# Inputs output to these addresses, transcoders/muxers consume from them
multicast_base = 239.100.0.1
multicast_port = 10000

# API port range for input monitors (udp_input HTTP API)
api_port_base = 9100

[stats]
# Statistics collection
enabled = true
collect_interval = 100
websocket_port = 8081

# Stats retention (seconds)
retention = 86400
